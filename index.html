<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>ALFIYA Perfume</title>
<style>
/* Фирменные шрифты Gotham Pro: Black и Bold — заголовки, Regular — подзаголовки и текст */
@font-face{font-family:"Gotham Pro";src:url("assets/fonts/GothaPro-Reg.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Gotham Pro";src:url("assets/fonts/GothaPro-Bol.otf") format("opentype");font-weight:700;font-display:swap}
@font-face{font-family:"Gotham Pro";src:url("assets/fonts/GothaPro-Bla.otf") format("opentype");font-weight:900;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --ink:#111111;      /* чёрный матовый  RGB 17 17 17  · CMYK 73 67 66 83 */
 --copper:#c58457;   /* медный          RGB 197 132 87 · CMYK 21 52 72 3 */
 --light:#f3f3f5;    /* светлый         RGB 243 243 245 · CMYK 3 2 2 0 */
 --grey:#8a8a8f;--line:#e2e2e6;
 --ease:cubic-bezier(.22,.9,.28,1);
}
html{scroll-behavior:smooth}
body{font-family:"Gotham Pro",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-weight:400;color:var(--ink);background:var(--light);line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.b9{font-weight:900}
.b7{font-weight:700}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
button{font-family:inherit;cursor:pointer}

/* ---------- Шапка ---------- */
header.top{position:sticky;top:0;z-index:30;background:var(--ink);border-bottom:1px solid rgba(197,132,87,.35)}
header.top .wrap{display:flex;align-items:center;gap:14px;height:68px}
header.top img.lg{height:44px;width:auto;display:block}
.sp{flex:1}
.quizbtn{display:inline-flex;align-items:center;height:46px;padding:0 20px;border:1.5px solid rgba(197,132,87,.7);border-radius:23px;color:#fff;text-decoration:none;font-size:15px;font-weight:700;letter-spacing:.04em;transition:background .25s,color .25s,border-color .25s}
.quizbtn:hover{background:var(--copper);color:var(--ink);border-color:var(--copper)}
@media(max-width:520px){.quizbtn{height:42px;padding:0 14px;font-size:13px}}
.cartbtn{position:relative;display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px 0 16px;border:1.5px solid var(--copper);background:transparent;color:var(--copper);border-radius:23px;font-size:15px;font-weight:700;letter-spacing:.04em;transition:background .25s,color .25s,transform .25s}
.cartbtn:hover{background:var(--copper);color:var(--ink)}
.cartbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cartbtn .n{min-width:22px;height:22px;border-radius:11px;background:var(--copper);color:var(--ink);font-size:12px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;transition:background .25s,color .25s}
.cartbtn:hover .n{background:var(--ink);color:var(--copper)}
.cartbtn.bump{animation:bump .5s var(--ease)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.14) rotate(-3deg)}100%{transform:scale(1)}}
@media(max-width:520px){.cartbtn .w{display:none}.cartbtn{padding:0 14px}header.top img.lg{height:38px}}

/* ---------- Hero с фирменным паттерном ---------- */
.hero{position:relative;background:var(--ink) url("assets/bg-hero.jpg") 50% 0/cover;color:#fff;overflow:hidden;min-height:clamp(500px,58vw,720px)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(17,17,17,.78) 0%,rgba(17,17,17,.4) 30%,rgba(17,17,17,0) 52%)}
.hero .wrap{position:relative;min-height:clamp(500px,58vw,720px);padding-top:44px;padding-bottom:30px;text-align:center;display:flex;flex-direction:column;align-items:center}
.hero .kick{color:var(--copper);font-size:13px;letter-spacing:.38em;text-transform:uppercase;font-weight:400}
.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.04;margin-top:14px;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--copper)}
.hero-quiz{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:34px;width:100%}
.hero-quiz .quizbtn{height:auto;min-height:48px;padding:13px 24px;text-align:center;justify-content:center;white-space:normal}
.hero-quiz p{font-size:13px;line-height:1.4;color:rgba(255,255,255,.78);max-width:320px}
@media(max-width:520px){.hero .wrap{min-height:clamp(500px,72vh,720px);padding-bottom:26px}.hero-quiz .quizbtn{font-size:13px;padding:12px 18px}.hero-quiz p{font-size:12px}}
.ctc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* ---------- Нижняя панель связи: появляется после прокрутки ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(17,17,17,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(197,132,87,.45);padding:10px 14px calc(10px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .64s var(--ease),visibility 0s linear .64s}
.dock.show{transform:none;visibility:visible;transition:transform .64s var(--ease),visibility 0s}
.dock .ctc{max-width:1160px;margin:0 auto;gap:8px;flex-wrap:nowrap}
.dock .ctc a{height:44px;padding:0 18px;font-size:14px;white-space:nowrap}
body.has-dock footer .wrap{padding-bottom:calc(44px + 76px + env(safe-area-inset-bottom))}
.ctc a{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:24px;border:1.5px solid rgba(197,132,87,.7);color:#fff;text-decoration:none;font-size:15px;font-weight:700;background:rgba(17,17,17,.55);backdrop-filter:blur(4px);transition:background .25s,color .25s,border-color .25s,transform .25s}
.ctc a:hover{background:var(--copper);color:var(--ink);border-color:var(--copper);transform:translateY(-2px)}
.ctc svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ctc a.wa{background:var(--copper);color:var(--ink);border-color:var(--copper)}
.ctc a.wa:hover{background:#fff;border-color:#fff}

/* ---------- Каталог ---------- */
.tools{padding:26px 0 4px}
.search{width:100%;min-width:0;flex:1;height:50px;border:1.5px solid var(--line);border-radius:25px;padding:0 22px;font:inherit;font-size:16px;outline:none;background:#fff;transition:border-color .2s}
.search:focus{border-color:var(--copper)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:19px;height:38px;padding:0 18px;font-size:14px;color:var(--ink);transition:all .2s}
.chip:hover{border-color:var(--copper)}
.chip.on{background:var(--ink);color:var(--copper);border-color:var(--ink);font-weight:700}
section.grp{padding:42px 0 6px}
.grp h2{font-size:clamp(32px,6.4vw,58px);color:#000;line-height:1.02;letter-spacing:-.01em}
.grp h2::after{content:"";display:block;width:56px;height:3px;background:var(--copper);margin-top:14px;border-radius:2px}
.grp p.d{font-size:14px;color:var(--grey);margin-top:12px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:20px;margin-top:24px}
.card{background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s}
.card{cursor:pointer;-webkit-user-select:none;user-select:none}
.card:active{transform:scale(.985)}
.card:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(17,17,17,.12);border-color:rgba(197,132,87,.5)}
.im{aspect-ratio:1/1;background:var(--ink) url("assets/bg-stone-sm.jpg") 50% 50%/cover;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.im img{width:100%;height:100%;object-fit:cover;display:block;position:relative}
.im::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(17,17,17,.4) 0%,rgba(17,17,17,.1) 100%)}
.im img.ph{position:relative;width:64%;height:auto;object-fit:contain}
.im img.tr{object-fit:contain;padding:7%}
.inf{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.br{font-size:11px;color:var(--copper);text-transform:uppercase;letter-spacing:.18em;font-weight:400}
.nm{font-size:18px;font-weight:700;margin-top:3px;line-height:1.2}
.pr{font-size:13.5px;font-weight:900;margin-bottom:8px}
.nt{font-size:12px;color:var(--grey);margin-top:6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bt{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bc{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:3px 10px 3px 3px;font-size:13px;line-height:1.15;color:var(--ink);text-align:left;transition:border-color .2s,background .2s}
.bc.noimg{padding-left:10px}
.bc img{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--ink);flex:none;display:block}
.bc img.tr{object-fit:contain;padding:2px}
/* выбор объёма (5 мл / 10 мл), под ним — флаконы этого объёма */
.vl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.vb{height:34px;padding:0 16px;border:1.5px solid var(--line);background:#fff;border-radius:17px;font-size:13px;font-weight:700;color:var(--ink);transition:border-color .2s,background .2s,color .2s}
.vb:hover{border-color:var(--copper)}
.vb.on{background:var(--ink);color:var(--copper);border-color:var(--ink)}
.bc b{display:block;font-weight:700}
.bc span{display:block;color:var(--grey);font-size:11px;margin-top:1px}
.bc:hover{border-color:var(--copper)}
.bc.on{border-color:var(--copper);background:#fbf3ee}
.bc.on span{color:#8a5a3a}
.ab{margin-top:auto;padding-top:14px}
.add{height:44px;width:100%;border:1.5px solid var(--ink);background:var(--ink);color:var(--copper);border-radius:12px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:background .25s,color .25s,transform .15s}
.add:hover{background:var(--copper);border-color:var(--copper);color:var(--ink)}
.add:active{transform:scale(.97)}
.add.done{background:var(--copper);border-color:var(--copper);color:var(--ink)}
.add .inc{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;margin-left:8px;border-radius:10px;background:var(--copper);color:var(--ink);font-size:11px;font-style:normal;font-weight:900;letter-spacing:0;vertical-align:middle;transition:background .25s,color .25s}
.add:hover .inc{background:var(--ink);color:var(--copper)}
.add .inc.bump{animation:qb .38s var(--ease)}
@keyframes ctlin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes qb{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}

/* ---------- Карточка товара (шторка) ---------- */
#pov{position:fixed;inset:0;background:rgba(17,17,17,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s;z-index:70}
#pov.open{opacity:1;visibility:visible}
#psh{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(580px,100%);max-height:92vh;max-height:92dvh;background:var(--light);border-radius:26px 26px 0 0;z-index:71;display:flex;flex-direction:column;overflow:hidden;transform:translateY(105%);visibility:hidden;transition:transform .6s cubic-bezier(.16,1,.3,1),visibility 0s linear .6s;box-shadow:0 -20px 60px rgba(0,0,0,.35)}
#psh.open{transform:none;visibility:visible;transition:transform .6s cubic-bezier(.16,1,.3,1),visibility 0s}
#psh.drag{transition:none}
.sh-grab{position:absolute;top:0;left:0;right:0;height:28px;z-index:3;display:flex;justify-content:center;padding-top:10px}
.sh-grab i{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.6);box-shadow:0 0 6px rgba(0,0,0,.3)}
.sh-x{position:absolute;top:14px;right:14px;z-index:4;width:40px;height:40px;border-radius:20px;border:1.5px solid rgba(197,132,87,.75);background:rgba(17,17,17,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--copper);display:flex;align-items:center;justify-content:center;transition:all .3s}
.sh-x:hover{background:var(--copper);color:var(--ink);transform:rotate(90deg)}
.sh-x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.sh-img{height:clamp(210px,36vh,320px);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:var(--ink) url("assets/bg-stone.jpg") 50% 50%/cover}
.sh-img.ph0{background:#fff}
.sh-img img{height:100%;width:100%;object-fit:contain;display:block}
.sh-img.tr img{padding:4% 0}
.sh-img.none img{width:46%;height:auto}
#psh.open .sh-img img{animation:shimg 1.1s var(--ease) both,flt 6s ease-in-out 1.1s infinite}
@keyframes shimg{from{opacity:0;transform:scale(1.18) translateY(14px)}to{opacity:1;transform:none}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sh-in{padding:20px 22px 12px}
.sh-br{font-size:12px;color:var(--copper);letter-spacing:.2em;text-transform:uppercase}
.sh-nm{font-size:clamp(26px,6vw,34px);line-height:1.08;margin-top:6px}
.sh-t{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--grey);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sh-t::after{content:"";flex:1;height:1px;background:var(--line)}
.sh-notes{display:flex;flex-wrap:wrap;gap:8px}
.nc{padding:7px 13px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:13px}
#psh.open .nc{animation:ncin .55s var(--ease) both;animation-delay:calc(.35s + var(--i)*45ms)}
@keyframes ncin{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
.sh-d{font-size:15px;line-height:1.6;color:#3a3a3d}
#psh.open .rv{animation:rv .65s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes rv{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sh-foot{padding:14px 22px calc(16px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;box-shadow:0 -10px 30px rgba(17,17,17,.06)}
.sh-pp{flex:1;min-width:0}
.sh-p{font-size:24px;font-weight:900;line-height:1.1}
.sh-p.req{font-size:15px;font-weight:700;color:var(--grey)}
.sh-tot{font-size:13px;color:var(--grey);max-height:0;opacity:0;overflow:hidden;transition:max-height .4s var(--ease),opacity .4s,margin .4s}
.sh-tot.on{max-height:30px;opacity:1;margin-top:3px}
.sh-tot b{color:var(--copper);font-weight:900}
.sh-foot .add{width:min(210px,52%);flex:none;height:48px;border-radius:24px}
.sh-in .pk>:first-child{margin-top:0}
.demo{margin-top:18px;font-size:13px;color:var(--grey);padding:10px 14px;background:#fff;border:1px dashed var(--copper);border-radius:12px;display:inline-block}
.state{padding:80px 0;text-align:center;color:var(--grey)}

footer{margin-top:70px;background:var(--ink) url("assets/bg-stone.jpg") 50% 50%/cover;color:rgba(243,243,245,.75);position:relative}
footer::before{content:"";position:absolute;inset:0;background:rgba(17,17,17,.5)}
footer .wrap{position:relative;padding:44px 20px;display:flex;gap:30px;flex-wrap:wrap;align-items:center;justify-content:space-between}
footer img{height:56px}
footer b{color:var(--copper);display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px;font-weight:400}

/* ---------- Окно выбора: тип → объём (мл) → флакон ---------- */
#oov{position:fixed;inset:0;background:rgba(17,17,17,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;z-index:80}
#oov.open{opacity:1;visibility:visible}
#osh{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(580px,100%);max-height:94vh;max-height:94dvh;background:var(--light);border-radius:26px 26px 0 0;z-index:81;display:flex;flex-direction:column;overflow:hidden;transform:translateY(105%);visibility:hidden;transition:transform .55s cubic-bezier(.16,1,.3,1),visibility 0s linear .55s;box-shadow:0 -20px 60px rgba(0,0,0,.4)}
#osh.open{transform:none;visibility:visible;transition:transform .55s cubic-bezier(.16,1,.3,1),visibility 0s}
#osh.drag{transition:none}
.oh{position:relative;display:flex;align-items:center;gap:12px;padding:24px 16px 14px 18px;color:#fff;background:var(--ink) url("assets/bg-stone-sm.jpg") 50% 50%/cover;border-bottom:2px solid var(--copper);flex:none}
.oh::before{content:"";position:absolute;inset:0;background:rgba(17,17,17,.45)}
.oh>*{position:relative}
.oh .gr{position:absolute;top:8px;left:50%;margin-left:-22px;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.55)}
.oh .th{width:52px;height:52px;border-radius:12px;background:var(--ink) url("assets/bg-stone-sm.jpg") 50% 50%/cover;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid rgba(197,132,87,.5)}
.oh .th img{width:100%;height:100%;object-fit:cover;display:block}
.oh .th img.ph{width:78%;height:auto;object-fit:contain}
.oh .th img.tr{object-fit:contain;padding:3px}
.oh .tt2{flex:1;min-width:0}
.oh .tt2 .b{font-size:10px;color:var(--copper);letter-spacing:.18em;text-transform:uppercase}
.oh .tt2 .n{font-size:18px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px 18px 12px}
.otp{display:flex;gap:8px;flex-wrap:wrap}
.ot{flex:1;min-width:120px;height:46px;border:1.5px solid var(--line);background:#fff;border-radius:23px;font-size:15px;font-weight:700;color:var(--ink);transition:all .2s}
.ot:hover{border-color:var(--copper)}
.ot.on{background:var(--ink);color:var(--copper);border-color:var(--ink)}
.onote{font-size:12px;color:var(--grey);margin-top:8px}
.ovl{display:flex;flex-wrap:wrap;gap:8px}
.ovl .vb{height:42px;padding:0 20px;border-radius:21px;font-size:14px}
.sx{animation:ctlin .35s var(--ease) both}
.strip{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:4px 18px 10px;margin:0 -18px;scroll-snap-type:x proximity;scroll-padding:0 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{display:none}
.bo{flex:0 0 clamp(88px,calc((100% - 30px)/3.4),128px);scroll-snap-align:start;position:relative;display:flex;flex-direction:column;gap:6px;padding:5px 5px 8px;border:2px solid var(--line);background:#fff;border-radius:15px;text-align:left;color:var(--ink);transition:border-color .2s,background .2s,transform .15s}
.bo:active{transform:scale(.97)}
.bo:hover{border-color:rgba(197,132,87,.6)}
.bo.on{border-color:var(--copper);background:#fbf3ee}
.bo .bim{aspect-ratio:1/1;border-radius:10px;background:var(--ink) url("assets/bg-stone-sm.jpg") 50% 50%/cover;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--copper);font-weight:900;font-size:15px}
.bo .bim img{width:100%;height:100%;object-fit:cover;display:block}
.bo .bim img.tr{object-fit:contain;padding:4px}
.bo b{font-size:12px;line-height:1.2;font-weight:700;padding:0 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.bo span{display:block;font-size:11px;color:var(--grey);padding:0 3px;margin-top:-2px}
.bo.on span{color:#8a5a3a}
.bo .ck{position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:11px;background:var(--copper);color:var(--ink);display:none;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.bo.on .ck{display:flex}
.bo .ck svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.of{flex:none;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(17,17,17,.06)}
.osum{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px;margin-bottom:10px}

/* ---------- Корзина ---------- */
function lines(){return Object.keys(cart).map(k=>{const{pid,bid,t}=parseKey(k),p=perfumes.find(x=>x.id==pid);return{k,p,b:bottleOf(bid),t:p&&typesOf(p).includes(t)?t:(p?typesOf(p)[0]:"orig"),q:cart[k]}}).filter(x=>x.p&&x.q>0)}
const unit=x=>(Number(x.p.price)||0)+(Number(x.b&&x.b.price)||0);
const priced=x=>hasP(x.p.price)||(x.b&&hasP(x.b.price)&&Number(x.b.price)>0);
/* старые позиции корзины (без типа) переводим на новый формат ключа */
function normCart(){const n={};for(const k of Object.keys(cart)){const{pid,bid,t}=parseKey(k),p=perfumes.find(x=>x.id==pid);
  if(!p){n[k]=(n[k]||0)+cart[k];continue}
  const ty=typesOf(p),nk=ckey(pid,bid,ty.includes(t)?t:ty[0]);n[nk]=(n[nk]||0)+cart[k]}
 cart=n;saveCart()}
const cartTypes=(k,x)=>{const ty=typesOf(x.p);
 return ty.length>1?`<div class="ctp" role="group" aria-label="Тип аромата">${ty.map(t=>`<button type="button" data-ct="${esc(k)}" data-t="${t}" aria-pressed="${t==x.t}" class="${t==x.t?"on":""}">${TN[t]}</button>`).join("")}</div>`:`<div class="bl">${TN[ty[0]]}</div>`};
const cartPicker=(k,bt)=>{const v=Number(bt.volume),vs=vols();
 return (vs.length>1?`<div class="vl" role="group" aria-label="Объём">${vs.map(x=>`<button type="button" class="vb${x==v?" on":""}" data-cv="${x}" data-ck="${esc(k)}">${x} мл</button>`).join("")}</div>`:"")
  +`<div class="bt" role="group" aria-label="Флакон">${bottles.filter(b=>Number(b.volume)==v).map(b=>chip(b,b.id==bt.id).replace("<button ",`<button data-ck="${esc(k)}" `)).join("")}</div>`};
/* смена флакона у позиции в корзине: количество переезжает на новый флакон (если такой уже есть — складывается) */
function moveLine(k,ch){const o=parseKey(k);if(!cart[k])return;
 const bid=ch.bid!==undefined?ch.bid:o.bid,t=ch.t!==undefined?ch.t:o.t;if(bid&&!bottleOf(bid))return;
 const nk=ckey(o.pid,bid,t);if(nk==k)return;
 cart[nk]=(cart[nk]||0)+cart[k];delete cart[k];if(cartOpen.has(k)){cartOpen.delete(k);cartOpen.add(nk)}
 const b=bottleOf(bid);if(b)lastB[o.pid+"|"+Number(b.volume)]=bid;saveCart();updateCart()}
const cartOpen=new Set();   // какие флаконы в корзине раскрыты
function updateCart(){
 const L=lines(),n=L.reduce((s,x)=>s+x.q,0),tot=L.reduce((s,x)=>s+x.q*unit(x),0);
 $("cartN").textContent=n;$("dCnt").textContent=n?n+" шт.":"";
 $("dTot").textContent=money(tot);
 $("dList").innerHTML=L.length?L.map(x=>{const{p,q,k}=x,bt=x.b,b=brands[p.brandId]||"";
  return `<div class="ci"><div class="pi">${p.img?`<img${tr(p.img)} src="${p.img}" alt="">`:ph}</div><div class="tx">${b?`<div class="b">${esc(b)}</div>`:""}<div class="n">${esc(p.name)}</div>${cartTypes(k,x)}${bt?`<div class="bx${cartOpen.has(k)?" open":""}"><button type="button" class="bsum" data-bxt="${esc(k)}" aria-expanded="${cartOpen.has(k)}">Флакон ${esc(bt.name)} · ${esc(bt.volume)} мл<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div class="bbody"><div class="bi">${bt.img?`<img${tr(bt.img)} src="${bt.img}" alt="">`:""}<div><b>${esc(bt.name)}</b><span>${esc(bt.volume)} мл${hasP(bt.price)&&Number(bt.price)>0?" · +"+money(bt.price):" · без доплаты"}</span></div></div>${cartPicker(k,bt)}</div></div>`:""}<div class="p">${priced(x)?money(unit(x)):""}</div><div class="qt"><button data-m="${esc(k)}" aria-label="Меньше">−</button><span>${q}</span><button data-p="${esc(k)}" aria-label="Больше">+</button></div></div><button class="rm" data-r="${esc(k)}" aria-label="Удалить"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button></div>`}).join(""):
  '<div class="emp"><img src="assets/logo-stack-black.png" alt=""><div class="b7">Корзина пуста</div>Добавьте ароматы из каталога</div>';
 const ob=$("ordBtn");ob.setAttribute("aria-disabled",L.length&&C.whatsapp?"false":"true");
 const t=waText(L);
 ob.href=L.length&&C.whatsapp?waUrl(t):"#";
 $("dClr").style.display=L.length?"":"none";
 syncAdd();if(orderOpen)renderOrderFoot();
}
$("dList").onclick=e=>{
 const cv=e.target.closest("[data-cv]"),cb=e.target.closest(".bc[data-ck]");
 const ct=e.target.closest("[data-ct]");
 if(ct){moveLine(ct.dataset.ct,{t:ct.dataset.t});return}
 if(cv){const k=cv.dataset.ck,pid=parseKey(k).pid,vol=+cv.dataset.cv,id=lastB[pid+"|"+vol];
  moveLine(k,{bid:bottleOf(id)?id:(bottles.find(b=>Number(b.volume)==vol)||{}).id});return}
 if(cb){moveLine(cb.dataset.ck,{bid:cb.dataset.bc});return}
 const bx=e.target.closest("[data-bxt]");
 if(bx){const k=bx.dataset.bxt,box=bx.closest(".bx"),o=!box.classList.contains("open");box.classList.toggle("open",o);bx.setAttribute("aria-expanded",o);o?cartOpen.add(k):cartOpen.delete(k);return}
 const m=e.target.closest("[data-m]"),p=e.target.closest("[data-p]"),r=e.target.closest("[data-r]");
 if(m){const id=m.dataset.m;cart[id]=(cart[id]||0)-1;if(cart[id]<=0)delete cart[id]}
 else if(p){const id=p.dataset.p;cart[id]=(cart[id]||0)+1}
 else if(r)delete cart[r.dataset.r];else return;
 saveCart();updateCart()};
$("dClr").onclick=()=>{cart={};saveCart();updateCart()};
function drawer(o){$("drw").classList.toggle("open",o);$("ov").classList.toggle("open",o);$("drw").setAttribute("aria-hidden",!o);syncLock();if(o)setTimeout(()=>$("dClose").focus(),300)}
$("cartBtn").onclick=()=>drawer(true);$("dClose").onclick=()=>drawer(false);$("ov").onclick=()=>drawer(false);
addEventListener("keydown",e=>{if(e.key=="Escape"){if(orderOpen)closeOrder();else if(openId)closeSheet();else drawer(false)}});

/* ---------- Загрузка данных ---------- */
renderContacts();
(async()=>{
 try{
  const col=collection(db,"aroma");
  const [c,g,b,p,bt]=await Promise.all([getDoc(doc(db,"aroma","shop-contacts")),
   getDocs(query(col,where("kind","==","shop-group"))),getDocs(query(col,where("kind","==","shop-brand"))),getDocs(query(col,where("kind","==","shop-perfume"))),getDocs(query(col,where("kind","==","shop-bottle")))]);
  if(c.exists())C=c.data();
  groups=g.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
  b.docs.forEach(d=>brands[d.id]=d.data().name);
  perfumes=p.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));
  bottles=bt.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
  if(!perfumes.length){demo=true;groups=DEMO_G;brands=DEMO_B;perfumes=DEMO_P}
  normCart();
 }catch(e){
  demo=true;groups=DEMO_G;brands=DEMO_B;perfumes=DEMO_P;
 }
 renderContacts();render();
 const qs=new URLSearchParams(location.search);   // ссылки из теста: ?open=<id аромата> открывает карточку
 if(qs.get("open")&&perfumes.some(p=>p.id==qs.get("open")))openSheet(qs.get("open"));
})();
</script>
</body>
