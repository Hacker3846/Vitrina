<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>ALFIYA Perfume</title>
<style>
/* Фирменные шрифты Gotham Pro: Black и Bold — заголовки, Regular — подзаголовки и текст */
@font-face{font-family:"Gotham Pro";src:url("assets/fonts/GothaPro-Reg.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Gotham Pro";src:url("assets/fonts/GothaPro-Bol.otf") format("opentype");font-weight:700;font-display:swap}
@font-face{font-family:"Gotham Pro";src:url("assets/fonts/GothaPro-Bla.otf") format("opentype");font-weight:900;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --ink:#111111;      /* чёрный матовый  RGB 17 17 17  · CMYK 73 67 66 83 */
 --copper:#c58457;   /* медный          RGB 197 132 87 · CMYK 21 52 72 3 */
 --light:#e3e3e3;    /* светлый         RGB 243 243 245 · CMYK 3 2 2 0 */
 --grey:#8a8a8f;--line:#e2e2e6;
 --ease:cubic-bezier(.22,.9,.28,1);
}
html{scroll-behavior:smooth}
body{font-family:"Gotham Pro",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-weight:400;color:var(--ink);background:var(--light);line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.b9{font-weight:900}
.b7{font-weight:700}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
button{font-family:inherit;cursor:pointer}

/* ---------- Шапка ---------- */
header.top{position:sticky;top:0;z-index:30;background:var(--ink);border-bottom:1px solid rgba(197,132,87,.35)}
header.top .wrap{display:flex;align-items:center;gap:14px;height:68px}
header.top img.lg{height:44px;width:auto;display:block}
.sp{flex:1}
.quizbtn{display:inline-flex;align-items:center;height:46px;padding:0 20px;border:1.5px solid rgba(197,132,87,.7);border-radius:23px;color:#fff;text-decoration:none;font-size:15px;font-weight:700;letter-spacing:.04em;transition:background .25s,color .25s,border-color .25s}
.quizbtn:hover{background:var(--copper);color:var(--ink);border-color:var(--copper)}
@media(max-width:520px){.quizbtn{height:42px;padding:0 14px;font-size:13px}}
.cartbtn{position:relative;display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px 0 16px;border:1.5px solid var(--copper);background:transparent;color:var(--copper);border-radius:23px;font-size:15px;font-weight:700;letter-spacing:.04em;transition:background .25s,color .25s,transform .25s}
.cartbtn:hover{background:var(--copper);color:var(--ink)}
.cartbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cartbtn .n{min-width:22px;height:22px;border-radius:11px;background:var(--copper);color:var(--ink);font-size:12px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;transition:background .25s,color .25s}
.cartbtn:hover .n{background:var(--ink);color:var(--copper)}
.cartbtn.bump{animation:bump .5s var(--ease)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.14) rotate(-3deg)}100%{transform:scale(1)}}
@media(max-width:520px){.cartbtn .w{display:none}.cartbtn{padding:0 14px}header.top img.lg{height:38px}}

/* ---------- Hero с фирменным паттерном ---------- */
.hero{position:relative;background:var(--ink) url("assets/bg-hero.jpg") 50% 0/cover;color:#fff;overflow:hidden;min-height:clamp(500px,58vw,720px)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(17,17,17,.78) 0%,rgba(17,17,17,.4) 30%,rgba(17,17,17,0) 52%)}
.hero .wrap{position:relative;min-height:clamp(500px,58vw,720px);padding-top:44px;padding-bottom:30px;text-align:center;display:flex;flex-direction:column;align-items:center}
.hero .kick{color:var(--copper);font-size:13px;letter-spacing:.38em;text-transform:uppercase;font-weight:400}
.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.04;margin-top:14px;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--copper)}
.hero-quiz{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:34px;width:100%}
.hero-quiz .quizbtn{height:auto;min-height:48px;padding:13px 24px;text-align:center;justify-content:center;white-space:normal}
.hero-quiz p{font-size:13px;line-height:1.4;color:rgba(255,255,255,.78);max-width:320px}
@media(max-width:520px){.hero .wrap{min-height:clamp(500px,72vh,720px);padding-bottom:26px}.hero-quiz .quizbtn{font-size:13px;padding:12px 18px}.hero-quiz p{font-size:12px}}
.ctc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* ---------- Нижняя панель связи: появляется после прокрутки ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(17,17,17,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(197,132,87,.45);padding:10px 14px calc(10px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .64s var(--ease),visibility 0s linear .64s}
.dock.show{transform:none;visibility:visible;transition:transform .64s var(--ease),visibility 0s}
.dock .ctc{max-width:1160px;margin:0 auto;gap:8px;flex-wrap:nowrap}
.dock .ctc a{height:44px;padding:0 18px;font-size:14px;white-space:nowrap}
body.has-dock footer .wrap{padding-bottom:calc(44px + 76px + env(safe-area-inset-bottom))}
.ctc a{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:24px;border:1.5px solid rgba(197,132,87,.7);color:#fff;text-decoration:none;font-size:15px;font-weight:700;background:rgba(17,17,17,.55);backdrop-filter:blur(4px);transition:background .25s,color .25s,border-color .25s,transform .25s}
.ctc a:hover{background:var(--copper);color:var(--ink);border-color:var(--copper);transform:translateY(-2px)}
.ctc svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ctc a.wa{background:var(--copper);color:var(--ink);border-color:var(--copper)}
.ctc a.wa:hover{background:#fff;border-color:#fff}

/* ---------- Каталог ---------- */
.tools{padding:26px 0 4px}
.search{width:100%;min-width:0;flex:1;height:50px;border:1.5px solid var(--line);border-radius:25px;padding:0 22px;font:inherit;font-size:16px;outline:none;background:#fff;transition:border-color .2s}
.search:focus{border-color:var(--copper)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:19px;height:38px;padding:0 18px;font-size:14px;color:var(--ink);transition:all .2s}
.chip:hover{border-color:var(--copper)}
.chip.on{background:var(--ink);color:var(--copper);border-color:var(--ink);font-weight:700}
section.grp{padding:42px 0 6px}
.grp h2{font-size:clamp(32px,6.4vw,58px);color:#000;line-height:1.02;letter-spacing:-.01em}
.grp h2::after{content:"";display:block;width:56px;height:3px;background:var(--copper);margin-top:14px;border-radius:2px}
.grp p.d{font-size:14px;color:var(--grey);margin-top:12px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:20px;margin-top:24px}
.card{background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s}
.card{cursor:pointer;-webkit-user-select:none;user-select:none}
.card:active{transform:scale(.985)}
.card:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(17,17,17,.12);border-color:rgba(197,132,87,.5)}
.im{aspect-ratio:1/1;background:var(--ink) url("assets/bg-stone-sm.jpg") 50% 50%/cover;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.im img{width:100%;height:100%;object-fit:cover;display:block;position:relative}
.im::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(17,17,17,.4) 0%,rgba(17,17,17,.1) 100%)}
.im img.ph{position:relative;width:64%;height:auto;object-fit:contain}
.im img.tr{object-fit:contain;padding:7%}
.inf{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.br{font-size:11px;color:var(--copper);text-transform:uppercase;letter-spacing:.18em;font-weight:400}
.nm{font-size:18px;font-weight:700;margin-top:3px;line-height:1.2}
.pr{font-size:13.5px;font-weight:900;margin-bottom:8px}
.nt{font-size:12px;color:var(--grey);margin-top:6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* выбор объёма (5 мл / 10 мл), под ним — флаконы этого объёма */
.vl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.vb{height:34px;padding:0 16px;border:1.5px solid var(--line);background:#fff;border-radius:17px;font-size:13px;font-weight:700;color:var(--ink);transition:border-color .2s,background .2s,color .2s}
.vb:hover{border-color:var(--copper)}
.vb.on{background:var(--ink);color:var(--copper);border-color:var(--ink)}
.ab{margin-top:auto;padding-top:14px}
.add{height:44px;width:100%;border:1.5px solid var(--ink);background:var(--ink);color:var(--copper);border-radius:12px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:background .25s,color .25s,transform .15s}
.add:hover{background:var(--copper);border-color:var(--copper);color:var(--ink)}
.add:active{transform:scale(.97)}
.add.done{background:var(--copper);border-color:var(--copper);color:var(--ink)}
.add .inc{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;margin-left:8px;border-radius:10px;background:var(--copper);color:var(--ink);font-size:11px;font-style:normal;font-weight:900;letter-spacing:0;vertical-align:middle;transition:background .25s,color .25s}
.add:hover .inc{background:var(--ink);color:var(--copper)}
.add .inc.bump{animation:qb .38s var(--ease)}
@keyframes ctlin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes qb{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}

/* ---------- Карточка товара (шторка) ---------- */
#pov{position:fixed;inset:0;background:rgba(17,17,17,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s;z-index:70}
#pov.open{opacity:1;visibility:visible}
#psh{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(580px,100%);max-height:92vh;max-height:92dvh;background:var(--light);border-radius:26px 26px 0 0;z-index:71;display:flex;flex-direction:column;overflow:hidden;transform:translateY(105%);visibility:hidden;transition:transform .6s cubic-bezier(.16,1,.3,1),visibility 0s linear .6s;box-shadow:0 -20px 60px rgba(0,0,0,.35)}
#psh.open{transform:none;visibility:visible;transition:transform .6s cubic-bezier(.16,1,.3,1),visibility 0s}
#psh.drag{transition:none}
.sh-grab{position:absolute;top:0;left:0;right:0;height:28px;z-index:3;display:flex;justify-content:center;padding-top:10px}
.sh-grab i{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.6);box-shadow:0 0 6px rgba(0,0,0,.3)}
.sh-x{position:absolute;top:14px;right:14px;z-index:4;width:40px;height:40px;border-radius:20px;border:1.5px solid rgba(197,132,87,.75);background:rgba(17,17,17,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--copper);display:flex;align-items:center;justify-content:center;transition:all .3s}
.sh-x:hover{background:var(--copper);color:var(--ink);transform:rotate(90deg)}
.sh-x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.sh-img{height:clamp(210px,36vh,320px);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:var(--ink) url("assets/bg-stone.jpg") 50% 50%/cover}
.sh-img.ph0{background:#fff}
.sh-img img{height:100%;width:100%;object-fit:contain;display:block}
.sh-img.tr img{padding:4% 0}
.sh-img.none img{width:46%;height:auto}
#psh.open .sh-img img{animation:shimg 1.1s var(--ease) both,flt 6s ease-in-out 1.1s infinite}
@keyframes shimg{from{opacity:0;transform:scale(1.18) translateY(14px)}to{opacity:1;transform:none}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sh-in{padding:20px 22px 12px}
.sh-br{font-size:12px;color:var(--copper);letter-spacing:.2em;text-transform:uppercase}
.sh-nm{font-size:clamp(26px,6vw,34px);line-height:1.08;margin-top:6px}
.sh-t{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--grey);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sh-t::after{content:"";flex:1;height:1px;background:var(--line)}
.sh-notes{display:flex;flex-wrap:wrap;gap:8px}
.nc{padding:7px 13px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:13px}
#psh.open .nc{animation:ncin .55s var(--ease) both;animation-delay:calc(.35s + var(--i)*45ms)}
@keyframes ncin{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
.sh-d{font-size:15px;line-height:1.6;color:#3a3a3d}
#psh.open .rv{animation:rv .65s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes rv{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sh-foot{padding:14px 22px calc(16px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;box-shadow:0 -10px 30px rgba(17,17,17,.06)}
.sh-pp{flex:1;min-width:0}
.sh-p{font-size:24px;font-weight:900;line-height:1.1}
.sh-p.req{font-size:15px;font-weight:700;color:var(--grey)}
.sh-tot{font-size:13px;color:var(--grey);max-height:0;opacity:0;overflow:hidden;transition:max-height .4s var(--ease),opacity .4s,margin .4s}
.sh-tot.on{max-height:30px;opacity:1;margin-top:3px}
.sh-tot b{color:var(--copper);font-weight:900}
.sh-foot .add{width:min(210px,52%);flex:none;height:48px;border-radius:24px}
.sh-in .pk>:first-child{margin-top:0}
.demo{margin-top:18px;font-size:13px;color:var(--grey);padding:10px 14px;background:#fff;border:1px dashed var(--copper);border-radius:12px;display:inline-block}
.state{padding:80px 0;text-align:center;color:var(--grey)}

footer{margin-top:70px;background:var(--ink) url("assets/bg-stone.jpg") 50% 50%/cover;color:rgba(243,243,245,.75);position:relative}
footer::before{content:"";position:absolute;inset:0;background:rgba(17,17,17,.5)}
footer .wrap{position:relative;padding:44px 20px;display:flex;gap:30px;flex-wrap:wrap;align-items:center;justify-content:space-between}
footer img{height:56px}
footer b{color:var(--copper);display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px;font-weight:400}

/* ---------- Окно выбора: тип → объём (мл) → флакон ---------- */
#oov{position:fixed;inset:0;background:rgba(17,17,17,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;z-index:80}
#oov.open{opacity:1;visibility:visible}
#osh{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(580px,100%);max-height:94vh;max-height:94dvh;background:var(--light);border-radius:26px 26px 0 0;z-index:81;display:flex;flex-direction:column;overflow:hidden;transform:translateY(105%);visibility:hidden;transition:transform .55s cubic-bezier(.16,1,.3,1),visibility 0s linear .55s;box-shadow:0 -20px 60px rgba(0,0,0,.4)}
#osh.open{transform:none;visibility:visible;transition:transform .55s cubic-bezier(.16,1,.3,1),visibility 0s}
#osh.drag{transition:none}
.oh{position:relative;display:flex;align-items:center;gap:12px;padding:24px 16px 14px 18px;color:#fff;background:var(--ink) url("assets/bg-stone-sm.jpg") 50% 50%/cover;border-bottom:2px solid var(--copper);flex:none}
.oh::before{content:"";position:absolute;inset:0;background:rgba(17,17,17,.45)}
.oh>*{position:relative}
.oh .gr{position:absolute;top:8px;left:50%;margin-left:-22px;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.55)}
.oh .th{width:52px;height:52px;border-radius:12px;background:var(--ink) url("assets/bg-stone-sm.jpg") 50% 50%/cover;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid rgba(197,132,87,.5)}
.oh .th img{width:100%;height:100%;object-fit:cover;display:block}
.oh .th img.ph{width:78%;height:auto;object-fit:contain}
.oh .th img.tr{object-fit:contain;padding:3px}
.oh .tt2{flex:1;min-width:0}
.oh .tt2 .b{font-size:10px;color:var(--copper);letter-spacing:.18em;text-transform:uppercase}
.oh .tt2 .n{font-size:18px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px 18px 12px}
.otp{display:flex;gap:8px;flex-wrap:wrap}
.ot{flex:1;min-width:120px;height:46px;border:1.5px solid var(--line);background:#fff;border-radius:23px;font-size:15px;font-weight:700;color:var(--ink);transition:all .2s}
.ot:hover{border-color:var(--copper)}
.ot.on{background:var(--ink);color:var(--copper);border-color:var(--ink)}
.onote{font-size:12px;color:var(--grey);margin-top:8px}
.ovl{display:flex;flex-wrap:wrap;gap:8px}
.ovl .vb{height:42px;padding:0 20px;border-radius:21px;font-size:14px}
.sx{animation:ctlin .35s var(--ease) both}
.of{flex:none;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(17,17,17,.06)}
.osum{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px;margin-bottom:10px}
.osum .sm{font-size:12.5px;color:var(--grey);line-height:1.3;min-width:0}
.osum .sm.hint{color:#8a5a3a}
.osum .sm.nudge{animation:nudge .45s var(--ease)}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.osum .pp{font-size:22px;font-weight:900;white-space:nowrap}
.osum .pp.req{font-size:14px;font-weight:700;color:var(--grey)}
.ob1,.ob2{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;border-radius:25px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;transition:background .25s,color .25s,opacity .25s,transform .15s;border:1.5px solid var(--ink)}
.ob1{background:var(--ink);color:var(--copper)}
.ob1:hover{background:var(--copper);border-color:var(--copper);color:var(--ink)}
.ob2{margin-top:8px;background:var(--copper);border-color:var(--copper);color:var(--ink)}
.ob2:hover{background:var(--ink);border-color:var(--ink);color:var(--copper)}
.ob1:active,.ob2:active{transform:scale(.98)}
.ob2 svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ob1[aria-disabled=true],.ob2[aria-disabled=true]{opacity:.38}
.ocap{font-size:11.5px;color:var(--grey);text-align:center;margin-top:6px;line-height:1.35}
#toast{position:fixed;top:78px;left:50%;z-index:95;display:flex;align-items:center;gap:14px;max-width:calc(100% - 28px);padding:11px 12px 11px 18px;background:var(--ink);color:#fff;border:1.5px solid var(--copper);border-radius:26px;font-size:14px;box-shadow:0 12px 34px rgba(0,0,0,.35);transform:translate(-50%,-18px);opacity:0;visibility:hidden;transition:transform .4s var(--ease),opacity .3s,visibility 0s linear .4s}
#toast.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .4s var(--ease),opacity .3s,visibility 0s}
#toast button{height:32px;padding:0 14px;border:0;border-radius:16px;background:var(--copper);color:var(--ink);font-size:13px;font-weight:700}
/* ---------- Корзина (выезжающее окно) ---------- */
#ov{position:fixed;inset:0;background:rgba(17,17,17,.55);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;z-index:60}
#ov.open{opacity:1;visibility:visible}
#drw{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--light);z-index:61;display:flex;flex-direction:column;transform:translateX(104%);visibility:hidden;transition:transform .55s var(--ease),visibility 0s linear .55s,box-shadow .55s;box-shadow:none}

/* флакон в корзине: строка-«раскрывашка» */

.rm{align-self:flex-start;width:34px;height:34px;border:0;background:transparent;color:var(--grey);border-radius:17px;flex:none;transition:all .2s}

.emp{text-align:center;color:var(--grey);padding:60px 20px}
.emp img{width:120px;opacity:.85;margin-bottom:14px}
.df{padding:16px 20px calc(18px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.tt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}

body.lock{overflow:hidden}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.nm{font-size:16px}.inf{padding:12px}.hero .wrap{padding-top:34px}.dock .ctc a{flex:1;justify-content:center;padding:0}.dock .ctc a span{display:none}.dock .ctc svg{width:22px;height:22px}}
.seg{display:flex;gap:4px;padding:4px;background:#fff;border:1.5px solid var(--line);border-radius:26px;flex:1;min-width:0}

.trow{display:flex;flex:1;min-width:0;gap:10px;align-items:center;justify-content:flex-end;padding-top:0;min-height:50px}
.fbtn{flex:none;width:42px;height:42px;padding:0;border:1.5px solid var(--line);background:#fff;border-radius:50%;font-size:0;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:0;transition:opacity .18s,transform .18s}
.fbtn[hidden]{display:none!important}
.fbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fbtn.on,.fbtn:hover{border-color:var(--copper)}
.trow .fbtn{flex:none;height:42px}
.flt .seg{margin-top:8px;max-width:420px}
.fbtn i{font-style:normal;min-width:20px;height:20px;border-radius:10px;background:var(--copper);color:var(--ink);font-size:11px;font-weight:900;display:none;align-items:center;justify-content:center;padding:0 5px}
.fbtn i.has{display:inline-flex}

.prow{display:flex;align-items:center;gap:8px;padding-top:8px;color:var(--grey)}
.prow input{width:120px;height:40px;border:1.5px solid var(--line);border-radius:20px;padding:0 14px;font:inherit;font-size:15px;outline:none}
.prow input:focus{border-color:var(--copper)}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px 0;font-size:13px;color:var(--grey)}
.fbar button{border:0;background:transparent;color:var(--copper);font-size:13px;font-weight:700;text-decoration:underline}
.tag{position:absolute;top:10px;left:10px;z-index:2;height:24px;padding:0 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.04em;display:inline-flex;align-items:center;background:rgba(243,243,245,.92);color:var(--ink)}
.tag.oil{background:var(--copper)}
.sh-ty{display:inline-block;margin-top:10px;height:26px;line-height:24px;padding:0 12px;border-radius:13px;font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line)}
.sh-ty.oil{background:var(--copper);border-color:var(--copper)}
.pr small,.sh-p small{font-size:.62em;font-weight:700;color:var(--grey)}.ps{color:var(--grey);font-weight:400;margin:0 2px}.sh-p{font-size:20px}.ots{font-weight:400;font-size:12px;opacity:.75;margin-left:6px}
.pp1{display:inline-block;white-space:nowrap}.card .pr{font-size:12.5px;line-height:1.35}.card .pr small{font-size:.74em}.card .ps{margin:0 1px}
.ot{height:auto;min-height:46px;padding:8px 14px;line-height:1.2}.ots{display:block;margin:2px 0 0}

/* ===== Плавная подгрузка: появление карточек, скелетоны, «Показать ещё», страницы ===== */
.fi{animation:cin .55s var(--ease) backwards;animation-delay:calc(var(--i,0)*38ms)}
@keyframes cin{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.card.sk{pointer-events:none;cursor:default;animation:cin .4s var(--ease) backwards}
.sk .im{background:linear-gradient(100deg,#ececef 30%,#f8f8fa 50%,#ececef 70%) 0 0/300% 100%;animation:shm 1.4s linear infinite}
.sk .im::before{display:none}
.sk .inf i{display:block;height:12px;border-radius:6px;margin-top:10px;background:linear-gradient(100deg,#ececef 30%,#f8f8fa 50%,#ececef 70%) 0 0/300% 100%;animation:shm 1.4s linear infinite}
.sk .inf i:nth-child(1){width:38%;height:9px;margin-top:0}
.sk .inf i:nth-child(2){width:80%;height:16px}
.sk .inf i:nth-child(3){width:55%;margin-bottom:46px}
@keyframes shm{from{background-position:100% 0}to{background-position:-100% 0}}
#allsec{scroll-margin-top:84px}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:32px 0 4px}
.pgb{min-width:44px;height:44px;padding:0 12px;border:1.5px solid var(--line);background:#fff;border-radius:22px;font-size:15px;font-weight:700;color:var(--ink);transition:background .3s,color .3s,border-color .3s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.pgb:hover:not(:disabled){border-color:var(--copper);transform:translateY(-2px)}
.pgb:active:not(:disabled){transform:scale(.94)}
.pgb.on{background:var(--ink);color:var(--copper);border-color:var(--ink)}
.pgb:disabled{opacity:.35;cursor:default}
.pge{color:var(--grey);padding:0 4px}
.pgi{min-width:44px;text-align:center;font-weight:700}

/* ===== Скользящая «таблетка» у переключателей (тип / вариант / мл) ===== */
.pl{position:relative;isolation:isolate}
.pill{position:absolute;left:0;top:0;width:0;height:0;border-radius:20px;background:var(--ink);box-shadow:0 3px 8px rgba(17,17,17,.22);z-index:0;opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.34,1.32,.5,1),width .5s cubic-bezier(.34,1.32,.5,1),height .4s var(--ease),opacity .3s}
.pill.nt{transition:none}
.seg.pl .pill{border-radius:19px}
.seg.pl button{position:relative;z-index:1;background:transparent;transition:color .35s,transform .2s}
.seg.pl button.on{background:transparent;color:var(--copper)}
.otp.pl,.ovl.pl{gap:4px;padding:4px;background:#fff;border:1.5px solid var(--line);border-radius:26px}
.pl .ot,.pl .vb{position:relative;z-index:1;border:0;background:transparent;border-radius:20px;color:var(--ink);transition:color .35s,transform .2s}
.pl .ot{flex:1 1 0;min-width:110px;height:auto;min-height:44px;padding:8px 14px}
.pl .vb{flex:1 1 0;height:auto;min-height:40px;padding:6px 18px;font-size:14px}
.pl .ot.on,.pl .vb.on{background:transparent;color:var(--copper)}
.pl .ot:hover,.pl .vb:hover{border-color:transparent}
.pl button:active{transform:scale(.95)}
.pl .vb small{display:block;font-size:10px;font-weight:400;opacity:.75;margin-top:1px}

/* раскрывающиеся секции окна заказа (вариант оригинала / объём) */
.osec{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;transform:translateY(-6px);transition:grid-template-rows .5s var(--ease),opacity .3s,transform .5s var(--ease),visibility 0s linear .5s}
.osec.open{grid-template-rows:1fr;opacity:1;visibility:visible;transform:none;transition:grid-template-rows .5s var(--ease),opacity .45s .08s,transform .5s var(--ease),visibility 0s}
.osec.nt,.osec.nt.open{transition:none}
.osi{min-height:0;overflow:hidden}
.osum .pp{animation:ctlin .3s var(--ease) both}

/* корзина: анимируем только новые строки и переключённые кнопки */
.ci{animation:none}
.ci.in{animation:inr .5s var(--ease) both}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.1)}100%{transform:scale(1)}}
.ctp.pop button.on,.cv.pop .on{animation:pop .42s cubic-bezier(.34,1.56,.64,1)}
.cv{margin-top:6px}
.cv .vb{height:30px;padding:0 12px;font-size:12px}

/* ===== Кнопка акций рядом с корзиной ===== */
.promobtn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px 0 14px;border-radius:23px;background:var(--copper);border:1.5px solid var(--copper);color:var(--ink);text-decoration:none;font-size:15px;font-weight:700;letter-spacing:.04em;transition:background .25s,color .25s,transform .25s}
.promobtn:hover{background:transparent;color:var(--copper)}
.promobtn:active{transform:scale(.96)}
.promobtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media(max-width:520px){.promobtn{height:42px;padding:0 12px 0 10px;gap:6px;font-size:13px}.promobtn svg{width:18px;height:18px}}

/* ===== Ароматы группы — лента, листается в бок ===== */
.gh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.gh>div:first-child{min-width:0}
.grid.gstrip{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;margin:14px -20px -14px;padding:10px 20px 30px;scroll-snap-type:x proximity;scroll-padding:0 20px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.gstrip::-webkit-scrollbar{display:none}
.gstrip>.card{flex:0 0 clamp(160px,41vw,236px);scroll-snap-align:start}
@media(min-width:900px){.gstrip>.card{flex-basis:224px}}
.gstrip.drag{scroll-snap-type:none;cursor:grabbing}
.gstrip img{-webkit-user-drag:none}

}

/* Цены: масло и оригинал на разлив — за мл; запечатанный оригинал — за штуку. */
const pOil=p=>hasP(p.oilPrice)?Number(p.oilPrice):null;
const pOrig=p=>p.origPrice!==undefined?(hasP(p.origPrice)?Number(p.origPrice):null):(hasOrig(p)&&hasP(p.price)?Number(p.price):null);

const priceParts=p=>{const a=[];if(hasOil(p)&&pOil(p)!=null)a.push(`<span class="pp1">${money(pOil(p))} <small>мл</small></span>`);if(hasOrig(p)){if(pOrig(p)!=null)a.push(`<span class="pp1">${money(pOrig(p))} <small>шт</small></span>`);else{if(hasOrigPour(p)&&pOrigPour(p)!=null)a.push(`<span class="pp1">${money(pOrigPour(p))} <small>мл</small></span>`);if(hasOrigSealed(p)&&pOrigSealed(p)!=null)a.push(`<span class="pp1">${money(pOrigSealed(p))} <small>шт</small></span>`)}}return a.join(' <span class="ps">/</span> ')};

const IC={
 phone:'<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',

 pin:'<svg viewBox="0 0 24 24"><path d="M12 21s7-6.200 7-11.500A7 7 0 0 0 5 9.500C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>'};

}

/* ---------- Каталог ---------- */
const ph='<img class="ph" src="assets/logo-horizontal.png" alt="">';

const tr=u=>/^data:image\/(webp|png)/.test(u)||/\.(webp|png)(\?|$)/i.test(u)?' class="tr"':"";

const vols=()=>[...new Set(bottles.map(b=>Number(b.volume)))].sort((a,b)=>a-b);

/* Сколько штук аромата уже в корзине (по всем флаконам и типам) */
const qtyOf=pid=>Object.keys(cart).reduce((n,k)=>n+(parseKey(k).pid==pid?cart[k]:0),0);

function syncAdd(){document.querySelectorAll("[data-add]").forEach(b=>{const q=qtyOf(b.dataset.add);let i=b.querySelector(".inc");
 if(q>0){if(!i){i=document.createElement("i");i.className="inc";b.appendChild(i)}
  if(i.textContent!=q){i.textContent=q;i.classList.remove("bump");void i.offsetWidth;i.classList.add("bump")}}
 else if(i)i.remove()})}
const skel=n=>Array.from({length:n},()=>'<div class="card sk" aria-hidden="true"><div class="im"></div><div class="inf"><i></i><i></i><i></i></div></div>').join("");
function cardHtml(p,i=0){const b=brands[p.brandId]||"";

/* Скользящая «таблетка» под активной кнопкой переключателя */

/* ---------- Состояние и запросы к БД ---------- */
/* Группы грузятся первыми (по GL ароматов, «Показать ещё» подгружает следующие).

   Поиск и фильтры работают по всему каталогу: он подгружается один раз, только когда фильтр включён. */
const GS={},gs=id=>GS[id]||(GS[id]={items:[],cur:null,done:false,busy:false});

async function loadGroup(id){
 const s=gs(id);if(s.busy||s.done)return;s.busy=true;paintGroup(id);
 try{
  const snap=await getDocs(query(col,where("kind","==","shop-perfume"),where("groupId","==",id),...(s.cur?[startAfter(s.cur)]:[]),limit(GL)));
  s.items.push(...snap.docs.map(reg));
  if(snap.docs.length)s.cur=snap.docs[snap.docs.length-1];
  if(snap.docs.length<GL)s.done=true;
 }catch(e){console.warn("group",id,e);s.done=true}
 s.busy=false;paintGroup(id)}
function paintGroup(id){

 if(s.done&&!s.items.length){box.hidden=true;return}
 const grid=box.querySelector(".grid");
 grid.querySelectorAll(".sk").forEach(e=>e.remove());
 const n=+grid.dataset.n||0;
 if(s.items.length>n)grid.insertAdjacentHTML("beforeend",s.items.slice(n).map((p,i)=>cardHtml(p,i)).join(""));
 grid.dataset.n=s.items.length;
 if(!s.done&&(s.busy||!s.items.length))grid.insertAdjacentHTML("beforeend",skel(4));

/* лента группы: следующие 12 ароматов подгружаются, когда долистали почти до конца */

function enableDrag(st){let x0=0,s0=0,down=false,moved=false;
 st.addEventListener("dragstart",e=>e.preventDefault());
 st.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0)return;down=true;moved=false;x0=e.clientX;s0=st.scrollLeft});
 st.addEventListener("pointermove",e=>{if(!down)return;const d=e.clientX-x0;
  if(!moved&&Math.abs(d)>5){moved=true;st.classList.add("drag");try{st.setPointerCapture(e.pointerId)}catch(_){}}
  if(moved)st.scrollLeft=s0-d});
 const end=()=>{down=false;st.classList.remove("drag")};
 st.addEventListener("pointerup",end);st.addEventListener("pointercancel",end);
 st.addEventListener("click",e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true)}
const fetching={},pending={};
async function fetchPage(i){
 const cons=[where("kind","==","shop-perfume"),PG.ord==="name"?orderBy("name"):orderBy(documentId())];
 if(i>1)cons.push(startAfter(PG.cur[i-1]));
 cons.push(limit(PS));
 let snap;
 try{snap=await getDocs(query(col,...cons))}
 catch(e){
  /* для сортировки по имени Firestore просит индекс (kind ↑, name ↑); без него идём по id */
  if(i===1&&PG.ord==="name"){console.warn("Создайте индекс Firestore (kind ↑, name ↑) для сортировки по имени:",e&&e.message);PG.ord="id";return fetchPage(1)}
  throw e}
 const docs=snap.docs;
 PG.cache[i]=docs.map(d=>reg(d).id);
 if(docs.length)PG.cur[i]=docs[docs.length-1];
 if(docs.length<PS)PG.pages=(docs.length||i===1)?i:i-1}
const fetchOnce=i=>fetching[i]||(fetching[i]=fetchPage(i).finally(()=>{delete fetching[i]}));
/* курсоры идут по цепочке, поэтому страница n тянет недостающие предыдущие (и кэширует их) */
function loadPage(n){
 if(PG.cache[n])return Promise.resolve();
 return pending[n]||(pending[n]=(async()=>{
  for(let i=1;i<=n;i++){if(PG.pages!=null&&i>PG.pages)break;if(!PG.cache[i])await fetchOnce(i)}
 })().finally(()=>{delete pending[n]}))}
async function loadCount(){
 try{const c=await getCountFromServer(query(col,where("kind","==","shop-perfume")));PG.total=c.data().count;PG.pages=Math.max(1,Math.ceil(PG.total/PS))}
 catch(e){console.warn("count",e)}}
function ensureAll(){

/* ---------- Фильтры ---------- */
const gk=p=>groups.some(x=>x.id==p.groupId)?String(p.groupId):"_";
const toggleSel=(set,v)=>{if(!v)set.clear();else if(set.has(v))set.delete(v);else set.add(v)};
const searchVal=()=>$("q").value.trim().toLowerCase();
const isFiltered=()=>!!(typeSel||brandSel.size||groupSel.size||$("pmin").value!==""||$("pmax").value!==""||searchVal());
const okP=p=>{
 if(typeSel&&!(typeSel=="oil"?hasOil(p):hasOrig(p)))return false;
 if(brandSel.size&&!brandSel.has(String(p.brandId)))return false;
 if(groupSel.size&&!groupSel.has(gk(p)))return false;
 const lo=$("pmin").value,hi=$("pmax").value;
 if(lo!==""||hi!==""){if(!pcs(p).some(v=>(lo===""||v>=Number(lo))&&(hi===""||v<=Number(hi))))return false}
 const s=searchVal();
 return !s||(p.name+" "+(brands[p.brandId]||"")).toLowerCase().includes(s)};
function buildChips(){
 const ids=Object.keys(brands).sort((a,b)=>String(brands[a]).localeCompare(String(brands[b]),"ru"));
 $("chips").innerHTML=ids.length?`<button class="chip on" data-b="">Все бренды</button>`+ids.map(id=>`<button class="chip" data-b="${esc(id)}">${esc(brands[id])}</button>`).join(""):"";
 const other=ALL&&ALL.some(p=>gk(p)==="_");
 $("gchips").innerHTML=groups.length?`<button class="chip on" data-g="">Все группы</button>`+groups.map(g=>`<button class="chip" data-g="${esc(g.id)}">${esc(g.name)}</button>`).join("")+(other?`<button class="chip" data-g="_">Другое</button>`:""):"";
 syncChips()}
function syncChips(){
 [...$("chips").children].forEach(b=>b.classList.toggle("on",b.dataset.b===""?!brandSel.size:brandSel.has(b.dataset.b)));
 [...$("gchips").children].forEach(b=>b.classList.toggle("on",b.dataset.g===""?!groupSel.size:groupSel.has(b.dataset.g)))}
function syncUI(){
 syncChips();
 const pr=[...REG.values()].flatMap(pcs);
 if(pr.length){$("pmin").placeholder="от "+Math.min(...pr);$("pmax").placeholder="до "+Math.max(...pr)}
 $("pcur").textContent=cur();
 const nf=(typeSel?1:0)+(brandSel.size?1:0)+(groupSel.size?1:0)+($("pmin").value!==""||$("pmax").value!==""?1:0);
 $("fn").textContent=nf;$("fn").classList.toggle("has",nf>0);$("freset").hidden=!(nf||searchVal());
 $("seg").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t==typeSel));
 pill($("seg"))}

/* ---------- Отрисовка ---------- */
function pagerHtml(cur,pages,more){
 if(pages!=null&&pages<=1)return"";
 if(pages==null&&cur===1&&!more)return"";
 const b=(l,v,c)=>`<button type="button" class="pgb ${c||""}" data-pg="${v}"${(c||"").includes("dis")?" disabled":""}>${l}</button>`;
 let h=b("‹","prev",cur<=1?"arr dis":"arr");
 if(pages==null)h+=`<span class="pgi">${cur}</span>`;
 else{
  const arr=pages<=7?Array.from({length:pages},(_,i)=>i+1):[...new Set([1,pages,cur-1,cur,cur+1].filter(x=>x>=1&&x<=pages))].sort((a,b)=>a-b);
  let prev=0;for(const n of arr){if(n-prev>1)h+=`<span class="pge">…</span>`;h+=b(n,n,n===cur?"on":"");prev=n}}
 h+=b("›","next",(pages!=null?cur>=pages:!more)?"arr dis":"arr");
 return `<nav class="pager" aria-label="Страницы">${h}</nav>`}
const scrollAll=()=>{const el=$("allsec");if(el)el.scrollIntoView({behavior:"smooth",block:"start"})};

/* Обычный режим: группы сверху, затем «Все ароматы» по страницам */
function buildDefault(){
 mode="def";
 let h=demo?demoNote:"";
 for(const g of groups)h+=`<section class="grp" id="gg-${esc(g.id)}"><div class="gh"><div><h2>${esc(g.name)}</h2>${g.desc?`<p class="d">${esc(g.desc)}</p>`:""}</div></div><div class="grid gstrip" data-n="0"></div></section>`;
 h+=`<section class="grp" id="allsec"><h2>Все ароматы</h2><p class="d" id="allD">Весь каталог в одном списке</p><div class="grid" id="allgrid"></div><div id="pager"></div></section>`;
 $("list").innerHTML=h;$("fcnt").textContent="";
 groups.forEach(g=>{paintGroup(g.id);const box=$("gg-"+g.id),st=box&&box.querySelector(".gstrip");
  if(st){st.addEventListener("scroll",()=>nearEnd(g.id),{passive:true});enableDrag(st)}});
 paintAll()}
function paintAll(){
 const grid=$("allgrid");if(!grid||mode!=="def")return;
 const ids=PG.cache[PG.page];
 grid.innerHTML=ids?ids.map((id,i)=>cardHtml(perfumeById(id),i)).join(""):skel(12);
 const d=$("allD");
 d.textContent=PG.total!=null?`${PG.total} аромат${plr(PG.total)}${PG.pages>1?` · страница ${PG.page} из ${PG.pages}`:""}`:"Весь каталог в одном списке";
 $("pager").innerHTML=ids?pagerHtml(PG.page,PG.pages,ids.length>=PS):""}
async function gotoPage(n){
 if(n<1||(PG.pages!=null&&n>PG.pages))return;
 PG.page=n;paintAll();scrollAll();
 try{await loadPage(n)}catch(e){console.warn("page",n,e)}
 if(PG.page!==n||mode!=="def")return;
 if(!PG.cache[n]){const g=$("allgrid");if(g)g.innerHTML='<div class="state" style="grid-column:1/-1;padding:40px 0">Не удалось загрузить страницу. Попробуйте ещё раз.</div>';return}
 if(!PG.cache[n].length&&n>1)PG.page=n-1;
 paintAll()}

/* Режим фильтров/поиска: один плоский список «Результаты» по всему каталогу, тоже по 100 на странице */
function buildFiltered(){
 mode="flt";
 $("list").innerHTML=`<section class="grp" id="allsec"><h2>Результаты</h2><p class="d" id="allD"></p><div class="grid" id="allgrid"></div><div id="pager"></div></section>`;
 paintFlt();
 if(!ALL)ensureAll().then(()=>{if(mode==="flt"){buildChips();syncUI();paintFlt()}}).catch(e=>{console.warn("all",e);const g=$("allgrid");if(g)g.innerHTML='<div class="state" style="grid-column:1/-1;padding:40px 0">Не удалось загрузить каталог для поиска</div>'})}
function paintFlt(){
 const grid=$("allgrid");if(!grid||mode!=="flt")return;
 if(!ALL){grid.innerHTML=skel(8);$("allD").textContent="Ищем по всему каталогу…";$("pager").innerHTML="";$("fcnt").textContent="";return}
 const L=ALL.filter(okP),pages=Math.max(1,Math.ceil(L.length/PS));FP=Math.min(Math.max(FP,1),pages);
 grid.innerHTML=L.length?L.slice((FP-1)*PS,FP*PS).map(cardHtml).join(""):'<div class="state" style="grid-column:1/-1;padding:40px 0">Ничего не найдено</div>';
 $("allD").textContent=L.length?`${L.length} аромат${plr(L.length)}${pages>1?` · страница ${FP} из ${pages}`:""}`:"";
 $("fcnt").textContent="Найдено: "+L.length;
 $("pager").innerHTML=pagerHtml(FP,pages,false)}

function render(){   // вызывается при любом изменении поиска и фильтров
 FP=1;syncUI();
 if(!isFiltered()){if(mode!=="def")buildDefault();return}
 if(mode!=="flt")buildFiltered();else paintFlt()}
function pageNav(v){
 if(mode==="def"){gotoPage(v==="prev"?PG.page-1:v==="next"?PG.page+1:+v)}
 else{const n=v==="prev"?FP-1:v==="next"?FP+1:+v;if(n<1)return;FP=n;paintFlt();scrollAll()}}

const deb=(f,ms)=>{let t;return()=>{clearTimeout(t);t=setTimeout(f,ms)}};
const renderD=deb(render,220);
$("q").oninput=$("pmin").oninput=$("pmax").oninput=renderD;
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;toggleSel(brandSel,b.dataset.b);render()};
$("gchips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;toggleSel(groupSel,b.dataset.g);render()};
$("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;typeSel=b.dataset.t;render()};
$("fbtn").onclick=()=>{const o=!$("flt").classList.contains("open");$("flt").classList.toggle("open",o);$("fbtn").classList.toggle("on",o);pill($("seg"))};
$("freset").onclick=()=>{typeSel="";brandSel.clear();groupSel.clear();$("pmin").value=$("pmax").value="";$("q").value="";render()};
/* страница подгружается заранее, когда курсор/палец навели на кнопку (лишних чтений нет) */
$("list").addEventListener("pointerover",e=>{
 const b=e.target.closest("[data-pg]");if(!b||mode!=="def"||b.disabled)return;
 const v=b.dataset.pg,n=v==="next"?PG.page+1:v==="prev"?PG.page-1:+v;
 if(n>=1&&!PG.cache[n]&&(n===1||PG.cache[n-1])&&(PG.pages==null||n<=PG.pages))loadPage(n).catch(()=>{})},{passive:true});

/* Подгрузка ароматов из корзины (их может не быть на загруженных страницах) */
async function hydrateCart(){
 const ids=[...new Set(Object.keys(cart).map(k=>parseKey(k).pid))].filter(id=>id&&!perfumeById(id));
 await Promise.all(ids.map(id=>getDoc(doc(db,"aroma",id)).then(d=>{if(d.exists()&&d.data().kind==="shop-perfume")reg(d)}).catch(()=>{})));
 normCart();updateCart()}
async function openFromUrl(){   // ссылки из теста: ?open=<id аромата> открывает карточку
 const o=new URLSearchParams(location.search).get("open");if(!o)return;
 let p=perfumeById(o);
 if(!p){try{const d=await getDoc(doc(db,"aroma",o));if(d.exists()&&d.data().kind==="shop-perfume")p=reg(d)}catch(e){}}
 if(p)openSheet(p.id)}
function enterDemo(){
 demo=true;groups=DEMO_G;brands=DEMO_B;
 ALL=DEMO_P.map(p=>{REG.set(p.id,p);return p}).sort(byName);
 groups.forEach(g=>{const s=gs(g.id);s.items=ALL.filter(p=>p.groupId==g.id);s.done=true});

 mode="";buildChips();renderContacts();render()}

function bumpCart(){const bt=$("cartBtn");bt.classList.remove("bump");void bt.offsetWidth;bt.classList.add("bump")}
document.addEventListener("click",e=>{
 const add=e.target.closest("[data-add]");
 if(add){openOrder(add.dataset.add);return}
  const pb=e.target.closest("[data-pg]");if(pb&&!pb.disabled){pageNav(pb.dataset.pg);return}

/* ---------- Карточка товара (шторка) ---------- */
let openId="",orderOpen=false;
const syncLock=()=>document.body.classList.toggle("lock",!!openId||orderOpen||$("drw").classList.contains("open"));
function shBody(p){
 const b=brands[p.brandId]||"",im=p.img;let d=0;const dl=()=>"--d:"+(d+=70)+"ms";
 const imgHtml=im?`<img${tr(im)} src="${im}" alt="${esc(p.name)}">`:ph;

 return `<div class="sh-img ${im?(tr(im)?"tr":"ph0"):"none"}">${imgHtml}</div><div class="sh-in">`
  +(b?`<div class="sh-br rv" style="${dl()}">${esc(b)}</div>`:"")

  +`<div class="rv" style="${dl()}">${typeGroupsOf(p).map(t=>`<span class="sh-ty${t=="oil"?" oil":""}" style="margin-right:6px">${t==="oil"?"Масляный":"Оригинальный"} аромат</span>`).join("")}</div>`
  +(Array.isArray(p.notes)&&p.notes.length?`<div class="sh-t rv" style="${dl()}">Ноты</div><div class="sh-notes">${p.notes.map((n,i)=>`<span class="nc" style="--i:${i}">${esc(n)}</span>`).join("")}</div>`:"")
  +(p.desc?`<div class="sh-t rv" style="${dl()}">Описание</div><p class="sh-d rv" style="${dl()}">${esc(p.desc).replace(/\n+/g,"<br><br>")}</p>`:"")
  +`</div>`}
function shFoot(p){const pp=priceParts(p),hp=!!pp;
 return `<div class="sh-pp"><div class="sh-p${hp?"":" req"}">${hp?pp:"Цена по запросу"}</div></div><button type="button" class="add" data-add="${esc(p.id)}">В корзину${incHtml(qtyOf(p.id))}</button>`}
function openSheet(pid){
 const p=perfumeById(pid);if(!p)return;openId=pid;
 $("pBody").innerHTML=shBody(p);$("pFoot").innerHTML=shFoot(p);$("pBody").scrollTop=0;
 const sh=$("psh");sh.style.transform="";
 requestAnimationFrame(()=>{sh.classList.add("open");$("pov").classList.add("open")});
 sh.setAttribute("aria-hidden","false");syncLock();setTimeout(()=>$("pClose").focus({preventScroll:true}),400)}
function closeSheet(){openId="";const sh=$("psh");sh.classList.remove("open");$("pov").classList.remove("open");sh.setAttribute("aria-hidden","true");syncLock();sh.style.transform=""}
$("pClose").onclick=closeSheet;$("pov").onclick=closeSheet;
function swipeClose(sh,sel,close){let y0=null,dy=0;   // свайп вниз по ручке/шапке закрывает шторку
 sh.addEventListener("touchstart",e=>{if(!e.target.closest(sel))return;y0=e.touches[0].clientY;dy=0;sh.classList.add("drag")},{passive:true});
 sh.addEventListener("touchmove",e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform="translateY("+dy+"px)"},{passive:true});
 sh.addEventListener("touchend",()=>{if(y0==null)return;sh.classList.remove("drag");const d=dy;y0=null;if(d>110)close();else sh.style.transform=""})}
swipeClose($("psh"),".sh-grab,.sh-img",closeSheet);

/* ---------- Окно выбора: тип → вариант → объём (мл) → «В корзину» / «Оформить сейчас» ---------- */
let os={pid:"",type:"",origMode:"",vol:null,bid:""};
const selectedType=()=>os.type==="orig"?os.origMode:os.type;
/* Текст заказа для WhatsApp: цены в нём — итоговые, как в корзине */
const ofLine=(x,i)=>`${i}. ${(brands[x.p.brandId]?brands[x.p.brandId]+" ":"")+x.p.name} (${typeLabel(x.t)})${x.b?", "+x.b.volume+" мл":""} × ${x.q}${priced(x)?" — "+money(x.q*unit(x))+AlfPricing.note(x,money,x.q*unit0(x)):""}`;
const waText=L=>{const G=reprice(L);return"Здравствуйте! Хочу заказать:\n"+L.map((x,i)=>ofLine(x,i+1)).join("\n")+AlfPricing.orderTail(G)+"\n\nИтого: "+money(L.reduce((s,x)=>s+x.q*unit(x),0))};
const osP=()=>perfumeById(os.pid);
const andList=a=>a.length>1?a.slice(0,-1).join(", ")+" и "+a[a.length-1]:a.join("");
function osMissing(){const m=[],t=selectedType();if(!os.type)m.push("тип");
 if(os.type==="orig"&&!os.origMode)m.push("вариант оригинала");
 if(bottles.length&&isBottleType(t)&&os.vol==null)m.push("объём");
 return m}
/* объём выбирается только в мл; флакон под него подставляется сам (если объём один — выбран сразу) */
function autoVol(){const vs=vols();if(os.vol==null||!vs.includes(os.vol))os.vol=vs.length===1?vs[0]:null;
 os.bid=os.vol!=null?((bottleForVol(os.vol)||{}).id||""):""}
const surTxt=v=>{const b=bottleForVol(v);return b&&hasP(b.price)&&Number(b.price)>0?`<small>+${money(b.price)}</small>`:""};
/* Каркас окна строится один раз при открытии; дальше меняются только классы — поэтому всё плавно анимируется */
function buildOrder(){
 const p=osP(),b=brands[p.brandId]||"",tg=typeGroupsOf(p),vs=vols();
 $("oHead").innerHTML=`<i class="gr"></i><div class="th">${p.img?`<img${tr(p.img)} src="${p.img}" alt="">`:ph}</div><div class="tt2">${b?`<div class="b">${esc(b)}</div>`:""}<div class="n">${esc(p.name)}</div></div><button class="xb" data-oclose aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 18L6 6"/></svg></button>`;
 let h=`<div class="sh-t">Тип</div><div class="otp pl" id="oTypes" role="group" aria-label="Тип аромата"><i class="pill"></i>${tg.map(t=>`<button type="button" class="ot" data-ot="${t}">${TN[t]}${tpr(p,t)}</button>`).join("")}</div>`
  +(tg.length===1&&tg[0]==="oil"?`<div class="onote">Для этого аромата доступен только вариант «Масляный»</div>`:"");
 if(tg.includes("orig"))h+=`<div class="osec" id="sMode"><div class="osi"><div class="sh-t">Вариант оригинала</div><div class="otp pl" id="oModes" role="group" aria-label="Вариант оригинала"><i class="pill"></i>${modeTypesOf(p).map(t=>`<button type="button" class="ot" data-om="${t}">${TN[t]}${tpr(p,t)}</button>`).join("")}</div></div></div>`
  +`<div class="osec" id="sSeal"><div class="osi"><div class="onote">Запечатанный оригинал продаётся целым флаконом — выбирать объём не нужно</div></div></div>`;
 if(bottles.length)h+=`<div class="osec" id="sVol"><div class="osi"><div class="sh-t">Объём, мл</div><div class="otp pl ovl" id="oVols" role="group" aria-label="Объём"><i class="pill"></i>${vs.map(v=>`<button type="button" class="vb" data-ov="${v}">${v} мл${surTxt(v)}</button>`).join("")}</div></div></div>`;
 $("oBody").innerHTML=h;
 const secs=$("oBody").querySelectorAll(".osec");secs.forEach(s=>s.classList.add("nt"));
 syncOrder();void $("oBody").offsetWidth;secs.forEach(s=>s.classList.remove("nt"))}
function syncOrder(){
 const t=selectedType();
 const on=(id,k,v)=>{const c=$(id);if(c)c.querySelectorAll("button").forEach(b=>{const a=String(b.dataset[k])===String(v);b.classList.toggle("on",a);b.setAttribute("aria-pressed",a)})};
 on("oTypes","ot",os.type);on("oModes","om",os.origMode);on("oVols","ov",os.vol);
 const op=(id,v)=>{const s=$(id);if(s)s.classList.toggle("open",!!v)};
 op("sMode",os.type==="orig");op("sSeal",t==="orig-sealed");op("sVol",bottles.length&&isBottleType(t));
 pillsAll();renderOrderFoot()}
const orderLines=()=>{const t=selectedType();return[{p:osP(),b:isBottleType(t)?bottleOf(os.bid):null,t,q:1}]};
function renderOrderFoot(){
 const m=osMissing(),ok=!m.length,sum=$("oSum"),add=$("oAdd"),now=$("oNow");
 add.setAttribute("aria-disabled",ok?"false":"true");
 if(!ok){sum.innerHTML=`<div class="sm hint">Осталось выбрать: ${andList(m)}</div>`;now.setAttribute("aria-disabled","true");now.href="#";return}
 const x=orderLines()[0],pr=priced(x);reprice([x]);
 const typeSummary=os.type==="orig"?"Оригинал · "+(TN[os.origMode]||"выберите вариант"):TN[os.type];

function openOrder(pid){
 const p=perfumeById(pid);if(!p)return;const ty=typesOf(p);

 $("toast").classList.remove("on");
 buildOrder();$("oBody").scrollTop=0;

 requestAnimationFrame(()=>{sh.classList.add("open");$("oov").classList.add("open");pillsAll()});

function closeOrder(){orderOpen=false;const sh=$("osh");sh.classList.remove("open");$("oov").classList.remove("open");sh.setAttribute("aria-hidden","true");syncLock();sh.style.transform=""}
$("oov").onclick=closeOrder;
swipeClose($("osh"),".oh",closeOrder);
$("osh").addEventListener("click",e=>{
 if(e.target.closest("[data-oclose]")){closeOrder();return}

  const t=selectedType(),bid=isBottleType(t)?os.bid:"";const k=ckey(os.pid,bid,t);cart[k]=(cart[k]||0)+1;saveCart();updateCart();bumpCart();closeOrder();toast("Добавлено в корзину");return}
 const now=e.target.closest("#oNow");
 if(now&&(osMissing().length||now.getAttribute("aria-disabled")=="true")){e.preventDefault();if(osMissing().length)nudgeOrder()}});

/* ---------- Корзина ---------- */
const canonicalType=(p,t)=>{const ty=typesOf(p);if(ty.includes(t))return t;if(t==="orig"||t==="orig-sealed"||t==="orig-pour")return ty.includes("orig-sealed")?"orig-sealed":(ty.find(x=>x.startsWith("orig-"))||ty[0]);return ty[0]||"orig-sealed"};
function lines(){return Object.keys(cart).map(k=>{const{pid,bid,t}=parseKey(k),p=perfumeById(pid),tt=p?canonicalType(p,t):(t||"orig-sealed");return{k,p,b:isBottleType(tt)?bottleOf(bid):null,t:tt,q:cart[k]}}).filter(x=>x.p&&x.q>0)}

/* ---------- Цена позиции ---------- */
const volOf=x=>Number(x.b&&x.b.volume)||0;
/* Масляный и оригинал на разлив: цена за мл × объём флакона + доплата за флакон; запечатанный оригинал: цена за штуку. */
const baseOf=x=>x.t==="orig-sealed"?(pOrigSealed(x.p)||0):(modePrice(x.p,x.t)||0)*volOf(x);
const unit0=x=>baseOf(x)+(isBottleType(x.t)?Number(x.b&&x.b.price)||0:0);
const unit=x=>unit0(x)-(x.d||0);
/* Итоговую цену позиций считает assets/pricing.js; здесь только цена из каталога и объём флакона. */
const reprice=L=>AlfPricing.apply(L,px,{vol:volOf,base:baseOf});
const priced=x=>x.t==="orig-sealed"?pOrigSealed(x.p)!=null:(modePrice(x.p,x.t)!=null&&volOf(x)>0);
/* старые позиции корзины (тип orig) переводим в новый формат как запечатанный оригинал */
function normCart(){const n={};for(const k of Object.keys(cart)){const{pid,bid,t}=parseKey(k),p=perfumeById(pid);
  if(!p){n[k]=(n[k]||0)+cart[k];continue}
  const tt=canonicalType(p,t),nbid=isBottleType(tt)?bid:"",nk=ckey(pid,nbid,tt);n[nk]=(n[nk]||0)+cart[k]}
 cart=n;saveCart()}
const cartTypes=(k,x)=>{const ty=typesOf(x.p);
 return ty.length>1?`<div class="ctp${k===popKey?" pop":""}" role="group" aria-label="Тип аромата">${ty.map(t=>`<button type="button" data-ct="${esc(k)}" data-t="${t}" aria-pressed="${t==x.t}" class="${t==x.t?"on":""}">${cartTypeLabel(t)}</button>`).join("")}</div>`:`<div class="bl">${cartTypeLabel(ty[0])}</div>`};
/* Объём в корзине — только мл; флакон под объём подставляется сам */
const cartVol=(k,x)=>{const v=volOf(x),vs=vols();return vs.length?`<div class="vl cv${k===popKey?" pop":""}" role="group" aria-label="Объём">${vs.map(n=>`<button type="button" class="vb${n==v?" on":""}" data-cv="${n}" data-ck="${esc(k)}">${n} мл</button>`).join("")}</div>`:""};
let cartSeen=new Set(),popKey="";   // cartSeen — уже показанные строки (анимируем только новые), popKey — строка, где переключили кнопку
/* смена объёма/типа у позиции в корзине: количество переезжает на новую позицию (если такая уже есть — складывается) */
function moveLine(k,ch){const o=parseKey(k);if(!cart[k])return;
 let bid=ch.bid!==undefined?ch.bid:o.bid;const t=ch.t!==undefined?ch.t:o.t;
 if(!isBottleType(t))bid="";else if(!bid&&bottles.length){const v=vols()[0];bid=(bottleForVol(v)||{}).id||""}
 if(bid&&!bottleOf(bid))return;
 const nk=ckey(o.pid,bid,t);if(nk==k)return;
 cart[nk]=(cart[nk]||0)+cart[k];delete cart[k];cartSeen.add(nk);popKey=nk;saveCart();updateCart()}
function updateCart(){
 const L=lines();reprice(L);const n=L.reduce((s,x)=>s+x.q,0),tot=L.reduce((s,x)=>s+x.q*unit(x),0);
 $("cartN").textContent=n;$("dCnt").textContent=n?n+" шт.":"";
 $("dTot").textContent=money(tot);
 $("dList").innerHTML=L.length?L.map(x=>{const{p,q,k}=x,bt=x.b,b=brands[p.brandId]||"";
  return `<div class="ci${cartSeen.has(k)?"":" in"}"><div class="pi">${p.img?`<img${tr(p.img)} src="${p.img}" alt="">`:ph}</div><div class="tx">${b?`<div class="b">${esc(b)}</div>`:""}<div class="n">${esc(p.name)}</div>${cartTypes(k,x)}${bt?cartVol(k,x):""}<div class="p">${priced(x)?money(unit(x)):""}</div><div class="qt"><button data-m="${esc(k)}" aria-label="Меньше">−</button><span>${q}</span><button data-p="${esc(k)}" aria-label="Больше">+</button></div></div><button class="rm" data-r="${esc(k)}" aria-label="Удалить"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button></div>`}).join(""):
  '<div class="emp"><img src="assets/logo-stack-black.png" alt=""><div class="b7">Корзина пуста</div>Добавьте ароматы из каталога</div>';
 const ob=$("ordBtn");ob.setAttribute("aria-disabled",L.length&&C.whatsapp?"false":"true");
 const t=waText(L);
 ob.href=L.length&&C.whatsapp?waUrl(t):"#";
 $("dClr").style.display=L.length?"":"none";
 cartSeen=new Set(L.map(x=>x.k));popKey="";syncAdd();if(orderOpen)renderOrderFoot();
}
$("dList").onclick=e=>{
 const cv=e.target.closest("[data-cv]"),ct=e.target.closest("[data-ct]");
 if(ct){moveLine(ct.dataset.ct,{t:ct.dataset.t});return}
 if(cv){moveLine(cv.dataset.ck,{bid:(bottleForVol(+cv.dataset.cv)||{}).id});return}
 const m=e.target.closest("[data-m]"),p=e.target.closest("[data-p]"),r=e.target.closest("[data-r]");
 if(m){const id=m.dataset.m;cart[id]=(cart[id]||0)-1;if(cart[id]<=0)delete cart[id]}
 else if(p){const id=p.dataset.p;cart[id]=(cart[id]||0)+1}
 else if(r)delete cart[r.dataset.r];else return;
 saveCart();updateCart()};
$("dClr").onclick=()=>{cart={};saveCart();updateCart()};
function drawer(o){$("drw").classList.toggle("open",o);$("ov").classList.toggle("open",o);$("drw").setAttribute("aria-hidden",!o);syncLock();if(o)setTimeout(()=>$("dClose").focus(),300)}
$("cartBtn").onclick=()=>drawer(true);$("dClose").onclick=()=>drawer(false);$("ov").onclick=()=>drawer(false);
addEventListener("keydown",e=>{if(e.key=="Escape"){if(orderOpen)closeOrder();else if(openId)closeSheet();else drawer(false)}});

/* ---------- Загрузка данных ---------- */
renderContacts();
$("list").innerHTML=`<section class="grp"><div class="grid">${skel(8)}</div></section>`;
(async()=>{
 /* 1. Лёгкие справочники: контакты, группы, бренды, флаконы, правила цен */
 try{
  const [c,g,b,bt,rl]=await Promise.all([getDoc(doc(db,"aroma","shop-contacts")),
   getDocs(query(col,where("kind","==","shop-group"))),getDocs(query(col,where("kind","==","shop-brand"))),getDocs(query(col,where("kind","==","shop-bottle"))),AlfPricing.load({getDocs,query,where},col).catch(()=>[])]);
  if(c.exists())C=c.data();
  groups=g.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
  b.docs.forEach(d=>brands[d.id]=d.data().name);
  bottles=bt.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
  px=rl.filter(p=>AlfPricing.isLive(p));
 }catch(e){console.warn(e);enterDemo();return}
 buildChips();renderContacts();hydrateCart();render();openFromUrl();
 /* 2. Группы ароматов — первыми (по GL штук, остальное по кнопке «Показать ещё») */
 await Promise.all(groups.map(g=>loadGroup(g.id)));
 /* 3. Затем «Все ароматы»: первая страница (100 шт.) и общий счётчик для страниц */
 await Promise.all([loadPage(1).catch(e=>console.warn("page 1",e)),loadCount()]);
 if(mode==="def")paintAll();
 if(!groups.some(g=>gs(g.id).items.length)&&!(PG.cache[1]||[]).length&&!PG.total)enterDemo();
})();
</script>
