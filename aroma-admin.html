<script>try{var t=localStorage.getItem("theme");document.documentElement.dataset.theme=t=="old"?"old":"new"}catch(e){document.documentElement.dataset.theme="new"}</script><link rel="stylesheet" href="style.css"><style>.ob{display:flex;align-items:center;gap:6px;margin:4px 0}.bd{width:28px;height:28px;flex:none;display:grid;place-items:center;border:1px solid var(--b2);border-radius:4px;font-size:13px;color:var(--g2)}
.tx{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;padding:4px;color:var(--t);font:inherit;cursor:pointer;box-shadow:none}

<header class="bar"><h1>Админка ароматов</h1><span class="sp"></span><span class="m pill" id="stat"></span><span class="m" id="dbs" role="status"></span><button onclick="dbLoad()">Из БД</button><button class="pri" onclick="dbSave()">☁ Сохранить в БД</button><button class="ico ghost theme" onclick="toggleTheme()" aria-label="Старая тема" title="Старая тема"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></button></header>
<div class="wrap">

<div class="card deco"><div class="row"><label for="cnOut">Выступ уголков</label><span class="m" id="cnOutVal">0.0%</span></div><input type="range" id="cnOut" min="0" max="1000" step="1" oninput="setCnOut(this.value)">

<details class="card imgs"><summary>Картинки тем (ZIP → БД)</summary>
<p class="m" style="margin:10px 0 0">Закиньте ZIP со всеми картинками обеих тем. Они сохранятся в БД и подставятся на сайте, если файлы рядом с ним не загрузятся.</p>

<main id="list"><div class="card"><div id="w1"></div></div>
<div class="card"><textarea id="nm" rows="2" placeholder="Новые элементы (по одному на строку)"></textarea><button class="ib" style="width:100%" onclick="addEls()" aria-label="Создать элементы" title="Создать элементы">+</button><div class="scr" id="w2"></div></div></main>

<script>
const $=i=>document.getElementById(i),LT='АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ',
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* папка: {objs:[вопрос, ответ-папка, ...], e:[id элементов]}; objs[0] — всегда вопрос, остальные — варианты ответа (у каждого своя папка f) */
const mk=()=>({objs:[],e:[]});let D={n:1,els:{},root:mk()},P=[],ed=-1;   // P — путь: индексы вариантов от корня
try{const s=localStorage.getItem('aroma2');if(s)D=JSON.parse(s)}catch(e){}
const at=p=>p.reduce((f,i)=>f.objs[i].f,D.root),cur=()=>at(P),each=(f,fn)=>{fn(f);f.objs.forEach(o=>o.f&&each(o.f,fn))};
function fix(){let f=D.root,k=0;while(k<P.length&&f.objs[P[k]]&&f.objs[P[k]].f){f=f.objs[P[k]].f;k++}P=P.slice(0,k)}
function st(){try{localStorage.setItem('aroma2',JSON.stringify(D))}catch(e){}$('js').value=JSON.stringify(D)}
function save(){st();render()}
function addObj(){const f=cur();f.objs.push({t:'',f:f.objs.length?mk():undefined});ed=f.objs.length-1;save()}
const edit=i=>{ed=i;render()},fin=(i,v)=>{if(ed!=i)return;cur().objs[i].t=v.trim();ed=-1;save()},op=i=>{P.push(i);ed=-1;render()},up=n=>{P=P.slice(0,n);ed=-1;render()};
function delAt(p,i){const f=at(p),o=f.objs[i];if(o.f&&(o.f.objs.length||o.f.e.length)&&!confirm('Удалить вместе со всем содержимым?'))return;f.objs.splice(i,1);save()}
function addEls(){const have=new Set(Object.values(D.els).map(x=>x.toLowerCase()));
 $('nm').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean).forEach(n=>{if(have.has(n.toLowerCase()))return;have.add(n.toLowerCase());D.els['e'+D.n++]=n});$('nm').value='';save()}
const putEl=id=>{const f=cur();if(!f.e.includes(id))f.e.push(id);save()},takeEl=id=>{const f=cur();f.e=f.e.filter(x=>x!=id);save()};
function delEl(id){if(!confirm('Удалить элемент «'+D.els[id]+'» везде?'))return;delete D.els[id];each(D.root,f=>f.e=f.e.filter(x=>x!=id));save()}
const tr=(f,p)=>f.objs.length>1||f.e.length?'<ul>'+f.objs.map((o,i)=>i?`<li><a href="#" onclick="P=[${p.concat(i)}];ed=-1;render();return false">${LT[i-1]||'•'}) ${esc(o.t||'…')}</a> <button class="sm" onclick="delAt([${p}],${i})" aria-label="Удалить" title="Удалить">✕</button>${tr(o.f,p.concat(i))}</li>`:'').join('')+f.e.map(id=>`<li class="m">• ${esc(D.els[id])}</li>`).join('')+'</ul>':'';
function render(){fix();const f=cur();let g=D.root;const nm=P.map(i=>{const n=(LT[i-1]||'•')+')';g=g.objs[i].f;return n});
 const row=(o,i)=>`<div class="ob"><span class="bd">${i?(LT[i-1]||'•')+')':'?'}</span>`+(ed==i?`<input value="${esc(o.t)}" placeholder="${i?'Ответ':'Вопрос'}" onblur="fin(${i},this.value)" onkeydown="if(event.key=='Enter')this.blur()">`:
  `<button class="tx" onclick="${i?`op(${i})`:`edit(0)`}">${esc(o.t||'…')}</button>`)+`<button class="ib" onclick="edit(${i})" aria-label="Изменить" title="Изменить">✎</button>`+
  (i==0&&f.objs.length>1?'':`<button class="ib" onclick="delAt([${P}],${i})" aria-label="Удалить" title="Удалить">✕</button>`)+'</div>';
 $('w1').innerHTML='<div class="row"><button class="sm" onclick="up(0)" aria-label="Корень" title="Корень">⌂</button>'+nm.map((n,k)=>`<button class="sm" onclick="up(${k+1})">${n}</button>`).join('')+'<span class="sp"></span><button class="ib" onclick="addObj()" aria-label="Добавить объект" title="Добавить объект">+</button></div><div class="scr">'+f.objs.map(row).join('')+
 (f.e.length?'<div>'+f.e.map(id=>`<span class="chip">${esc(D.els[id])} <button class="sm" onclick="takeEl('${id}')" aria-label="Убрать" title="Убрать">✕</button></span>`).join('')+'</div>':'')+'</div>';
 if(ed>=0){const x=$('w1').querySelector('input');if(x){x.focus();x.select()}}
 $('w2').innerHTML=Object.keys(D.els).map(id=>{const h=f.e.includes(id);return `<div class="ob"><span class="tx">${esc(D.els[id])}</span><button class="ib" onclick="putEl('${id}')" ${h?'disabled':''} aria-label="Добавить в папку" title="Добавить в папку">+</button><button class="ib" onclick="delEl('${id}')" aria-label="Удалить везде" title="Удалить везде">✕</button></div>`}).join('')+'<hr>'+tr(D.root,[]);
 let no=0;each(D.root,x=>no+=Math.max(x.objs.length-1,0));$('stat').textContent=no+' ответов, '+Object.keys(D.els).length+' элементов';$('js').value=JSON.stringify(D)}
function cp(){$('js').select();try{document.execCommand('copy')}catch(e){}}
function imp(){try{D=JSON.parse($('js').value);if(!D.root)throw 0;P=[];save()}catch(e){alert('Неверный JSON')}}
window.getD=()=>JSON.stringify(D);window.setD=t=>{D=JSON.parse(t);P=[];save()};
window.setCnOut=v=>{const pct=(v/10).toFixed(1);document.documentElement.style.setProperty('--cn-out',v/10);$('cnOutVal').textContent=pct+'%';try{localStorage.setItem('cnOut',v)}catch(e){}};
(function(){let sv=null;try{sv=localStorage.getItem('cnOut')}catch(e){}if(sv==null)sv=140;$('cnOut').value=sv;setCnOut(sv)})();
window.setEdge=v=>{document.documentElement.style.setProperty('--eu',v);$('edT').value=v;$('edTVal').textContent=v+' px';try{localStorage.setItem('edgeT',v)}catch(e){}};
(function(){let sv=null;try{sv=localStorage.getItem('edgeT')}catch(e){}if(sv==null)sv=10;setEdge(sv)})();
render();
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyBnHrPE4dLu1Hl_1wxm7nL9Iu2ZSty5hBY",authDomain:"messenjer8uchilisha.firebaseapp.com",projectId:"messenjer8uchilisha",storageBucket:"messenjer8uchilisha.firebasestorage.app",messagingSenderId:"323729368567",appId:"1:323729368567:web:67fff7eb9a659d55917af2"}));const ref=doc(db,"aroma","tree2");
const tmo=()=>new Promise((_,r)=>setTimeout(()=>r(new Error("нет ответа от БД")),12000));
window.dbImgSet&&dbImgSet(async k=>{try{const x=await Promise.race([getDoc(doc(db,"aroma","img-"+k)),tmo()]);return x.exists()&&x.data().data||null}catch(e){return null}},
 async()=>{try{const x=await Promise.race([getDoc(doc(db,"aroma","img-meta")),tmo()]);return x.exists()?x.data().files||{}:{}}catch(e){return null}});
const st=t=>document.getElementById("dbs").textContent=t;
window.dbSave=async()=>{st("Сохраняем…");try{await Promise.race([setDoc(ref,{json:getD(),cnOut:+$('cnOut').value,edgeT:+$('edT').value,updatedAt:serverTimestamp()}),tmo()]);st("Сохранено "+new Date().toLocaleTimeString("ru-RU"))}catch(e){st("Ошибка: "+e.message)}};
window.impDb=async()=>{let parsed;try{parsed=JSON.parse(document.getElementById("js").value);if(!parsed.root)throw 0}catch(e){alert("Неверный JSON");return}
 if(!confirm("Заменить данные в БД содержимым поля JSON? Текущие данные в БД будут перезаписаны."))return;
 st("Сохраняем…");try{await Promise.race([setDoc(ref,{json:JSON.stringify(parsed),cnOut:+$('cnOut').value,edgeT:+$('edT').value,updatedAt:serverTimestamp()}),tmo()]);window.setD(JSON.stringify(parsed));st("Сохранено в БД "+new Date().toLocaleTimeString("ru-RU"))}catch(e){st("Ошибка: "+e.message)}};
window.dbLoad=async()=>{if(!confirm("Заменить текущие данные данными из БД?"))return;st("Загружаем…");try{const x=await Promise.race([getDoc(ref),tmo()]);if(!x.exists()){st("В БД пока пусто");return}const v=x.data();setD(v.json);if(v.cnOut!=null)setCnOut(v.cnOut);if(v.edgeT!=null)setEdge(v.edgeT);st("Загружено из БД")}catch(e){st("Ошибка: "+e.message)}};

/* ===== Картинки тем: ZIP -> БД (коллекция aroma, документы img-<имя>, список — в img-meta) ===== */
{const GROUPS=[['Новая тема',[['bg-pc','Фон, широкий экран'],['bg-phone','Фон, телефон'],['edge-t','Кромка рамы'],['corner','Уголок рамы'],['smoke','Дымок']]],
 ['Старая тема',[['old-bg-pc','Фон, широкий экран'],['old-bg-phone','Фон, телефон'],['old-edge-t','Кромка рамы'],['old-corner','Уголок рамы']]]],
KEYS=new Set(GROUPS.flatMap(g=>g[1].map(x=>x[0]))),MIME={webp:'image/webp',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',avif:'image/avif',gif:'image/gif'},
MAX=700*1024,metaRef=doc(db,"aroma","img-meta"),ST={};
const kb=n=>Math.max(1,Math.round(n/1024))+' КБ',when=t=>new Date(t).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'});
const draw=()=>{$('imgl').innerHTML=GROUPS.map(([t,a])=>`<h4>${t}</h4>`+a.map(([k,n])=>{const s=ST[k]||{};
 const txt=s.busy?'сохраняем…':s.err?'ошибка: '+esc(s.err):s.size?'в БД · '+kb(s.size)+(s.t?' · '+when(s.t):''):'нет в БД';
 return `<div class="it ${s.err?'er':s.size&&!s.busy?'ok':''}"><span>${n}</span><span>${txt}</span></div>`}).join('')).join('')};
const note=t=>$('imgn').textContent=t;
/* распаковка ZIP средствами браузера: метод 0 (без сжатия) и 8 (deflate) */
async function unzip(buf){const dv=new DataView(buf),u=new Uint8Array(buf);let e=buf.byteLength-22;
 while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('это не ZIP-архив');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out=[];
 for(let i=0;i<n&&dv.getUint32(p,true)===0x02014b50;i++){const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true),
  name=new TextDecoder().decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;if(name.endsWith('/'))continue;
  const ds=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true);out.push({name,m,raw:u.subarray(ds,ds+cs)})}
 return out}
async function bytesOf(z){if(z.m===0)return z.raw;if(z.m!==8)throw new Error('неподдерживаемое сжатие');
 return new Uint8Array(await new Response(new Blob([z.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
/* слишком тяжёлую картинку (лимит документа в БД ~1 МБ) пережимаем в webp */
async function fit(b,type){if(b.length<=MAX)return{b,type};const bmp=await createImageBitmap(new Blob([b],{type}));let sc=1;
 for(let k=0;k<8;k++){const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const o=await new Promise(r=>c.toBlob(r,'image/webp',.82));if(o&&o.size<=MAX)return{b:new Uint8Array(await o.arrayBuffer()),type:'image/webp'};sc*=.8}
 throw new Error('слишком тяжёлая')}
const dataUrl=(b,type)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(new Blob([b],{type}))});
/* имя в архиве -> ключ: bg-pc.webp, old-bg-pc.webp или папка old/bg-pc.webp */
function keyOf(path){const seg=path.split('/').filter(Boolean),file=seg.pop()||'';if(file.startsWith('.')||seg.includes('__MACOSX'))return null;
 const m=file.match(/^(.*)\.([a-z0-9]+)$/i);if(!m)return null;const ext=m[2].toLowerCase();if(!MIME[ext])return null;
 let b=m[1].toLowerCase().trim();if(seg.some(s=>/^(old|старая|старый)$/i.test(s))&&!b.startsWith('old-'))b='old-'+b;
 return KEYS.has(b)?{key:b,type:MIME[ext]}:{skip:file}}
async function zipUpload(file){if(!file)return;note('Читаем архив…');
 let list;try{list=await unzip(await file.arrayBuffer())}catch(e){note('Не получилось открыть: '+e.message);return}
 const found={},skipped=[];list.forEach(z=>{const k=keyOf(z.name);if(!k)return;if(k.skip)skipped.push(k.skip);else found[k.key]={...k,z}});
 const keys=[...KEYS].filter(k=>found[k]);if(!keys.length){note('В архиве нет подходящих картинок. Ожидаются имена: '+[...KEYS].join(', ')+' (старую тему можно положить в папку old/).');return}
 let ok=0,t=Date.now();const meta={};
 for(const k of keys){ST[k]={...ST[k],busy:1,err:''};draw();note(`Сохраняем в БД: ${ok+1} из ${keys.length}…`);
  try{const f=found[k];let{b,type}=await fit(await bytesOf(f.z),f.type);const data=await dataUrl(b,type);
   await Promise.race([setDoc(doc(db,"aroma","img-"+k),{data,type,size:b.length,updatedAt:serverTimestamp()}),tmo()]);
   ST[k]={size:b.length,t};meta[k]={size:b.length,t};ok++;window.imgPut&&imgPut(k,data,t)}
  catch(e){ST[k]={...ST[k],busy:0,err:e.message||String(e)}}draw()}
 if(ok)try{await Promise.race([setDoc(metaRef,{files:meta},{merge:true}),tmo()])}catch(e){}
 const miss=[...KEYS].filter(k=>!found[k]);
 note(`Сохранено в БД: ${ok} из ${keys.length}.`+(miss.length?` Не было в архиве: ${miss.join(', ')}.`:'')+(skipped.length?` Пропущены (неизвестные имена): ${skipped.join(', ')}.`:'')+(ok<keys.length?' Если «ошибка» — проверьте правила доступа к коллекции aroma в Firestore.':''))}
const zi=$('zip'),dz=$('drop');
zi.onchange=()=>{zipUpload(zi.files[0]);zi.value=''};
['dragenter','dragover'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('on')}));
['dragleave','drop'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove('on')}));
dz.addEventListener('drop',e=>zipUpload(e.dataTransfer.files[0]));
draw();
getDoc(metaRef).then(x=>{if(x.exists()){const f=x.data().files||{};Object.keys(f).forEach(k=>ST[k]=f[k]);draw()}}).catch(()=>{});}
</script></body></html>
