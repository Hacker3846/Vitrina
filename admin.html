<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Админка — Ароматы</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111;--grey:#8a8a8a;--line:#e4e4e4;--soft:#f6f5f3;--red:#c62828;--ok:#1b7f3b}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--soft);line-height:1.4}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:12px;min-height:58px;padding-bottom:0}
header h1{font-size:18px}
.sp{flex:1}
#status{font-size:13px;color:var(--grey)}
#status.ok{color:var(--ok)}#status.err{color:var(--red)}
nav.tabs{display:flex;gap:6px;margin:16px 0;overflow-x:auto}
nav.tabs button{flex:none;border:1px solid var(--line);background:#fff;height:40px;padding:0 18px;border-radius:20px;font-size:15px;cursor:pointer}
nav.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{display:none}.panel.on{display:block}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.box h2{font-size:17px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--grey);margin:10px 0 4px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
button.b{height:42px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:0 18px;font-size:15px;cursor:pointer}
button.b.g{background:#fff;color:var(--ink);border-color:var(--line)}
button.b.d{background:#fff;color:var(--red);border-color:#f0c4c4}
button.b:disabled{opacity:.5;cursor:wait}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:13px;color:var(--grey);display:block}
.item img,.item .ph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--soft);flex:none}
.item .a{display:flex;gap:6px;flex:none}
.item .a button{height:36px;padding:0 12px;font-size:14px}
.empty{color:var(--grey);font-size:14px;padding:6px 0}
.prev{margin-top:10px}.prev img{width:120px;height:120px;object-fit:cover;border-radius:12px;display:block;border:1px solid var(--line)}
.prev button{margin-top:8px;height:34px;font-size:13px}
.hint{font-size:12px;color:var(--grey);margin-top:6px}
</style>
</head>
<body>
<header><div class="wrap"><h1>Админка</h1><span class="sp"></span><span id="status">Загрузка…</span></div></header>
<div class="wrap">
<nav class="tabs" id="tabs">
 <button data-p="perfumes" class="on">Ароматы</button>
 <button data-p="groups">Группы</button>
 <button data-p="brands">Бренды</button>
 <button data-p="contacts">Контакты</button>
</nav>

<!-- Ароматы -->
<section class="panel on" id="p-perfumes">
 <div class="box">
  <h2 id="pf-title">Добавить аромат</h2>
  <label>Название</label><input id="pf-name" placeholder="Например, Sauvage">
  <div class="row">
   <div><label>Бренд</label><select id="pf-brand"></select></div>
   <div><label>Группа</label><select id="pf-group"></select></div>
   <div><label>Цена</label><input id="pf-price" type="number" inputmode="decimal" min="0" placeholder="0"></div>
  </div>
  <label>Картинка аромата</label><input id="pf-file" type="file" accept="image/*">
  <div class="prev" id="pf-prev"></div>
  <div class="acts"><button class="b" id="pf-save">Сохранить</button><button class="b g" id="pf-cancel" hidden>Отмена</button></div>
 </div>
 <div class="box"><h2>Все ароматы <span id="pf-cnt" style="color:var(--grey);font-weight:400"></span></h2><div id="pf-list"></div></div>
</section>

<!-- Группы -->
<section class="panel" id="p-groups">
 <div class="box">
  <h2 id="gr-title">Добавить группу</h2>
  <label>Название (крупно, чёрным)</label><input id="gr-name" placeholder="Например, Мужские">
  <label>Описание (мелко, серым)</label><textarea id="gr-desc" placeholder="Короткое описание группы"></textarea>
  <div class="acts"><button class="b" id="gr-save">Сохранить</button><button class="b g" id="gr-cancel" hidden>Отмена</button></div>
 </div>
 <div class="box"><h2>Все группы</h2><div id="gr-list"></div></div>
</section>

<!-- Бренды -->
<section class="panel" id="p-brands">
 <div class="box">
  <h2 id="br-title">Добавить бренд</h2>
  <label>Название бренда</label><input id="br-name" placeholder="Например, Dior">
  <div class="acts"><button class="b" id="br-save">Сохранить</button><button class="b g" id="br-cancel" hidden>Отмена</button></div>
 </div>
 <div class="box"><h2>Все бренды</h2><div id="br-list"></div></div>
</section>

<!-- Контакты -->
<section class="panel" id="p-contacts">
 <div class="box">
  <h2>Контакты магазина</h2>
  <label>Название магазина</label><input id="c-shop" placeholder="Ароматы">
  <label>Телефон</label><input id="c-phone" type="tel" placeholder="+7 900 000-00-00">
  <label>WhatsApp (номер)</label><input id="c-wa" type="tel" placeholder="+7 900 000-00-00">
  <label>Instagram (ник или ссылка)</label><input id="c-ig" placeholder="@myshop">
  <label>Адрес магазина</label><input id="c-addr" placeholder="Город, улица, дом">
  <label>Валюта (отображается рядом с ценой)</label><input id="c-cur" placeholder="₽">
  <div class="acts"><button class="b" id="c-save">Сохранить контакты</button><button class="b d" id="c-clear">Очистить все</button></div>
  <p class="hint">Пустое поле = иконка на сайте не показывается.</p>
 </div>
</section>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,deleteDoc,query,where}from"https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyBnHrPE4dLu1Hl_1wxm7nL9Iu2ZSty5hBY",authDomain:"messenjer8uchilisha.firebaseapp.com",projectId:"messenjer8uchilisha",storageBucket:"messenjer8uchilisha.firebasestorage.app",messagingSenderId:"323729368567",appId:"1:323729368567:web:67fff7eb9a659d55917af2"}));
const COL="aroma";
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let groups=[],brands=[],perfumes=[];
let editP=null,editG=null,editB=null,imgData="";

function status(t,c){const s=$("status");s.textContent=t;s.className=c||"";if(c=="ok")setTimeout(()=>{if(s.textContent==t){s.textContent="";s.className=""}},2500)}
async function run(fn,msg){try{status("Сохраняем…");await fn();status(msg||"Сохранено","ok")}catch(e){status("Ошибка: "+e.message,"err");alert("Ошибка: "+e.message)}}

// tabs
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x==b));
 document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id=="p-"+b.dataset.p))};

// load
async function loadAll(){
 const col=collection(db,COL);
 const [g,b,p,c]=await Promise.all([getDocs(query(col,where("kind","==","shop-group"))),getDocs(query(col,where("kind","==","shop-brand"))),getDocs(query(col,where("kind","==","shop-perfume"))),getDoc(doc(db,COL,"shop-contacts"))]);
 groups=g.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
 brands=b.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));
 perfumes=p.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));
 const C=c.exists()?c.data():{};
 $("c-shop").value=C.shopName||"";$("c-phone").value=C.phone||"";$("c-wa").value=C.whatsapp||"";$("c-ig").value=C.instagram||"";$("c-addr").value=C.address||"";$("c-cur").value=C.currency||"";
 renderAll();
}
function renderAll(){renderGroups();renderBrands();renderPerfumes();fillSelects()}

function fillSelects(){
 const bv=$("pf-brand").value,gv=$("pf-group").value;
 $("pf-brand").innerHTML='<option value="">— без бренда —</option>'+brands.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("");
 $("pf-group").innerHTML='<option value="">— без группы —</option>'+groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join("");
 $("pf-brand").value=bv;$("pf-group").value=gv;
}

// ---------- Perfumes
function renderPerfumes(){
 $("pf-cnt").textContent=perfumes.length?"("+perfumes.length+")":"";
 $("pf-list").innerHTML=perfumes.length?perfumes.map(p=>{
  const b=brands.find(x=>x.id==p.brandId),g=groups.find(x=>x.id==p.groupId);
  return `<div class="item">${p.img?`<img src="${p.img}" alt="">`:'<div class="ph"></div>'}<div class="t"><b>${esc(p.name)}</b><span>${esc(b?b.name:"без бренда")} · ${esc(g?g.name:"без группы")}${p.price!==""&&p.price!=null?" · "+esc(p.price):""}</span></div><div class="a"><button class="b g" data-e="${p.id}">Изменить</button><button class="b d" data-d="${p.id}">Удалить</button></div></div>`}).join(""):'<div class="empty">Пока нет ароматов</div>';
}
function prevImg(){$("pf-prev").innerHTML=imgData?`<img src="${imgData}" alt=""><button class="b d" id="pf-rmimg" type="button">Убрать картинку</button>`:""}
$("pf-prev").onclick=e=>{if(e.target.id=="pf-rmimg"){imgData="";$("pf-file").value="";prevImg()}};
function resetP(){editP=null;imgData="";$("pf-name").value="";$("pf-price").value="";$("pf-file").value="";$("pf-title").textContent="Добавить аромат";$("pf-cancel").hidden=true;prevImg()}
$("pf-cancel").onclick=resetP;

function compress(file,max=700,q=.78){return new Promise((res,rej)=>{
 const r=new FileReader();r.onerror=()=>rej(new Error("Не удалось прочитать файл"));
 r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error("Это не картинка"));
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
   c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
   const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
   res(c.toDataURL("image/jpeg",q))};im.src=r.result};r.readAsDataURL(file)})}
$("pf-file").onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{imgData=await compress(f);prevImg()}catch(er){alert(er.message);e.target.value=""}};

$("pf-save").onclick=()=>{
 const name=$("pf-name").value.trim();if(!name){alert("Введите название аромата");return}
 const old=perfumes.find(x=>x.id==editP);
 const id=editP||uid("shop-perfume");
 const data={kind:"shop-perfume",name,brandId:$("pf-brand").value,groupId:$("pf-group").value,price:$("pf-price").value===""?"":Number($("pf-price").value),img:imgData||"",ts:old?old.ts:Date.now()};
 const btn=$("pf-save");btn.disabled=true;
 run(async()=>{await setDoc(doc(db,COL,id),data);
  const i=perfumes.findIndex(x=>x.id==id);if(i>=0)perfumes[i]={id,...data};else perfumes.unshift({id,...data});
  resetP();renderPerfumes()}).finally(()=>btn.disabled=false)};
$("pf-list").onclick=e=>{
 const ed=e.target.closest("[data-e]"),dl=e.target.closest("[data-d]");
 if(ed){const p=perfumes.find(x=>x.id==ed.dataset.e);editP=p.id;imgData=p.img||"";
  $("pf-name").value=p.name;$("pf-brand").value=p.brandId||"";$("pf-group").value=p.groupId||"";$("pf-price").value=p.price??"";$("pf-file").value="";
  $("pf-title").textContent="Изменить аромат";$("pf-cancel").hidden=false;prevImg();scrollTo({top:0,behavior:"smooth"})}
 if(dl){const p=perfumes.find(x=>x.id==dl.dataset.d);if(!confirm("Удалить «"+p.name+"»?"))return;
  run(async()=>{await deleteDoc(doc(db,COL,p.id));perfumes=perfumes.filter(x=>x.id!=p.id);if(editP==p.id)resetP();renderPerfumes()},"Удалено")}};

// ---------- Groups
function renderGroups(){
 $("gr-list").innerHTML=groups.length?groups.map(g=>`<div class="item"><div class="t"><b>${esc(g.name)}</b><span>${esc(g.desc||"")}</span></div><div class="a"><button class="b g" data-e="${g.id}">Изменить</button><button class="b d" data-d="${g.id}">Удалить</button></div></div>`).join(""):'<div class="empty">Пока нет групп</div>'}
function resetG(){editG=null;$("gr-name").value="";$("gr-desc").value="";$("gr-title").textContent="Добавить группу";$("gr-cancel").hidden=true}
$("gr-cancel").onclick=resetG;
$("gr-save").onclick=()=>{
 const name=$("gr-name").value.trim();if(!name){alert("Введите название группы");return}
 const old=groups.find(x=>x.id==editG),id=editG||uid("shop-group");
 const data={kind:"shop-group",name,desc:$("gr-desc").value.trim(),order:old?old.order:Date.now()};
 run(async()=>{await setDoc(doc(db,COL,id),data);const i=groups.findIndex(x=>x.id==id);if(i>=0)groups[i]={id,...data};else groups.push({id,...data});resetG();renderGroups();fillSelects();renderPerfumes()})};
$("gr-list").onclick=e=>{
 const ed=e.target.closest("[data-e]"),dl=e.target.closest("[data-d]");
 if(ed){const g=groups.find(x=>x.id==ed.dataset.e);editG=g.id;$("gr-name").value=g.name;$("gr-desc").value=g.desc||"";$("gr-title").textContent="Изменить группу";$("gr-cancel").hidden=false;scrollTo({top:0,behavior:"smooth"})}
 if(dl){const g=groups.find(x=>x.id==dl.dataset.d);const n=perfumes.filter(p=>p.groupId==g.id).length;
  if(!confirm("Удалить группу «"+g.name+"»?"+(n?"\nАроматы из неё ("+n+") останутся и перейдут в «Другое».":"")))return;
  run(async()=>{await deleteDoc(doc(db,COL,g.id));groups=groups.filter(x=>x.id!=g.id);if(editG==g.id)resetG();renderGroups();fillSelects();renderPerfumes()},"Удалено")}};

// ---------- Brands
function renderBrands(){
 $("br-list").innerHTML=brands.length?brands.map(b=>`<div class="item"><div class="t"><b>${esc(b.name)}</b><span>${perfumes.filter(p=>p.brandId==b.id).length} аромат(ов)</span></div><div class="a"><button class="b g" data-e="${b.id}">Изменить</button><button class="b d" data-d="${b.id}">Удалить</button></div></div>`).join(""):'<div class="empty">Пока нет брендов</div>'}
function resetB(){editB=null;$("br-name").value="";$("br-title").textContent="Добавить бренд";$("br-cancel").hidden=true}
$("br-cancel").onclick=resetB;
$("br-save").onclick=()=>{
 const name=$("br-name").value.trim();if(!name){alert("Введите название бренда");return}
 const id=editB||uid("shop-brand"),data={kind:"shop-brand",name};
 run(async()=>{await setDoc(doc(db,COL,id),data);const i=brands.findIndex(x=>x.id==id);if(i>=0)brands[i]={id,...data};else brands.push({id,...data});brands.sort((a,b)=>a.name.localeCompare(b.name));resetB();renderBrands();fillSelects();renderPerfumes()})};
$("br-list").onclick=e=>{
 const ed=e.target.closest("[data-e]"),dl=e.target.closest("[data-d]");
 if(ed){const b=brands.find(x=>x.id==ed.dataset.e);editB=b.id;$("br-name").value=b.name;$("br-title").textContent="Изменить бренд";$("br-cancel").hidden=false;scrollTo({top:0,behavior:"smooth"})}
 if(dl){const b=brands.find(x=>x.id==dl.dataset.d);const n=perfumes.filter(p=>p.brandId==b.id).length;
  if(!confirm("Удалить бренд «"+b.name+"»?"+(n?"\nУ "+n+" аромат(ов) бренд будет не указан.":"")))return;
  run(async()=>{await deleteDoc(doc(db,COL,b.id));brands=brands.filter(x=>x.id!=b.id);if(editB==b.id)resetB();renderBrands();fillSelects();renderPerfumes()},"Удалено")}};

// ---------- Contacts
$("c-save").onclick=()=>run(()=>setDoc(doc(db,COL,"shop-contacts"),{kind:"shop-contacts",shopName:$("c-shop").value.trim(),phone:$("c-phone").value.trim(),whatsapp:$("c-wa").value.trim(),instagram:$("c-ig").value.trim(),address:$("c-addr").value.trim(),currency:$("c-cur").value.trim()}));
$("c-clear").onclick=()=>{if(!confirm("Очистить все контакты?"))return;
 run(async()=>{await deleteDoc(doc(db,COL,"shop-contacts"));["c-shop","c-phone","c-wa","c-ig","c-addr","c-cur"].forEach(i=>$(i).value="")},"Контакты очищены")};

loadAll().then(()=>status("Готово","ok")).catch(e=>{status("Не удалось загрузить: "+e.message,"err")});
</script>
</body>
</html>
